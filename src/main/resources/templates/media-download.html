<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="media_download_mgmt_title">媒体下载管理 - 前端杀手</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/media-download.css}">
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/layout :: sidebar('media')}"></div>
        <div class="main-area">
            <div th:replace="~{fragments/layout :: header('MEDIA_DOWNLOAD')}"></div>
            <main class="content">

    <div class="pg-container">

        <!-- ====== 顶部工具栏 ====== -->
        <div class="md-toolbar">
            <div class="md-toolbar-left">
                <button class="btn btn-warning" id="btnPauseAll" onclick="pauseAll()">
                    <span class="btn-icon">⏸️</span> <span data-i18n="btn_pause_all">全部暂停</span>
                </button>
                <button class="btn btn-danger" id="btnStopAll" onclick="stopAll()">
                    <span class="btn-icon">⏹️</span> <span data-i18n="btn_stop_all">全部停止</span>
                </button>
            </div>
            <div class="md-toolbar-right">
                <button class="btn" onclick="manualRefresh()">
                    <span class="btn-icon">🔄</span> <span data-i18n="refresh_status">刷新状态</span>
                </button>
            </div>
        </div>

        <!-- ====== SS 配额面板（紧凑一行） ====== -->
        <div class="md-quota-bar" id="quotaBar">
            <div class="md-quota-item">
                <span class="md-quota-label" data-i18n="quota_today_short">今日配额</span>
                <span class="md-quota-value" id="qRequests">- / -</span>
            </div>
            <div class="md-quota-item md-quota-progress-wrap">
                <div class="md-quota-track">
                    <div class="md-quota-fill" id="qBar" style="width:0%"></div>
                </div>
                <span class="md-quota-pct" id="qPct">0%</span>
            </div>
            <div class="md-quota-item">
                <span class="md-quota-label" data-i18n="quota_threads_short">线程</span>
                <span class="md-quota-value" id="qThreads">-</span>
            </div>
            <div class="md-quota-item">
                <span class="md-quota-label" data-i18n="quota_level_short">等级</span>
                <span class="md-quota-value md-quota-level" id="qLevel">-</span>
            </div>
            <div class="md-quota-item md-quota-global-status">
                <span class="md-phase-badge" id="globalPhaseBadge">--</span>
            </div>
        </div>

        <!-- ====== 平台任务列表 ====== -->
        <div id="platformList" class="md-platform-list">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p data-i18n="loading_text">加载中...</p>
            </div>
        </div>

        <!-- ====== 空状态 ====== -->
        <div id="emptyState" class="empty-state" style="display:none;">
            <h3>📭 <span data-i18n="no_tasks_title">暂无媒体下载任务</span></h3>
            <p data-i18n="no_tasks_desc">当前没有需要刮削的媒体文件，请先执行刮削任务</p>
        </div>

    </div>

    <!-- ====== 失败任务弹窗 ====== -->
    <div id="failedTaskModal" class="ft-modal-overlay" style="display:none;">
        <div class="ft-modal">
            <div class="ft-modal-header">
                <h3 id="failedModalTitle">❗ 失败任务</h3>
                <div class="ft-header-actions">
                    <button id="ftClearAllBtn" class="ft-clear-all-btn" onclick="clearAllFailedTasks()" style="display:none;" data-i18n="failed_clear_all">清除全部</button>
                    <button class="ft-modal-close" onclick="closeFailedTaskModal()">&times;</button>
                </div>
            </div>
            <div id="failedTaskList" class="ft-modal-body">
                <p class="ft-loading" data-i18n="failed_loading">加载中...</p>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ========== 状态 ==========
        let refreshing = false;
        let expandedPlatforms = new Set();   // 展开的平台 ID
        let lastGlobalPhase = '';
        let lastIsPaused = false;

        // ========== 工具函数 ==========
        function $(id) { return document.getElementById(id); }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function phaseLabel(phase) {
            const map = {
                'INFO_SCRAPING': '信息刮削中',
                'MEDIA_DOWNLOAD': '媒体下载中',
                'PAUSED': '已暂停',
                'STOPPED': '已停止',
                'WAITING': '等待中',
                'COMPLETED': '已完成'
            };
            return map[phase] || phase || '--';
        }

        function phaseClass(phase) {
            const map = {
                'INFO_SCRAPING': 'info-scraping',
                'MEDIA_DOWNLOAD': 'media-downloading',
                'PAUSED': 'paused',
                'STOPPED': 'stopped',
                'WAITING': 'waiting',
                'COMPLETED': 'completed'
            };
            return map[phase] || 'waiting';
        }

        // ========== 全局控制 ==========
        window.pauseAll = async function() {
            try {
                const r = await fetch('/api/scraper/pause-all', { method: 'POST' });
                const d = await r.json();
                if (d.success) {
                    showToast(I18n.t('paused_all', '已暂停所有平台'), 'success');
                    refreshData();
                } else {
                    showToast(d.message || I18n.t('pause_failed', '暂停失败'), 'error');
                }
            } catch (e) {
                showToast(I18n.t('pause_failed', '暂停失败'), 'error');
            }
        };

        window.stopAll = async function() {
            if (!confirm(I18n.t('confirm_stop_all', '确定要停止所有平台的刮削吗？'))) return;
            try {
                const r = await fetch('/api/scraper/stop-all', { method: 'POST' });
                const d = await r.json();
                if (d.success) {
                    showToast(I18n.t('stopped_all', '已停止所有平台'), 'success');
                    refreshData();
                } else {
                    showToast(d.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (e) {
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        };

        window.manualRefresh = function() {
            refreshData();
        };

        // ========== 平台级控制 ==========
        window.pausePlatform = async function(pid) {
            try {
                const r = await fetch('/api/scraper/platforms/' + pid + '/pause', { method: 'POST' });
                const d = await r.json();
                showToast(d.success ? I18n.t('paused_platform', '已暂停') : (d.message || I18n.t('pause_failed', '暂停失败')),
                    d.success ? 'success' : 'error');
                refreshData();
            } catch (e) { showToast(I18n.t('pause_failed', '暂停失败'), 'error'); }
        };

        window.resumePlatform = async function(pid) {
            try {
                const r = await fetch('/api/scraper/platforms/' + pid + '/resume', { method: 'POST' });
                const d = await r.json();
                showToast(d.success ? I18n.t('resumed_platform', '已恢复') : (d.message || I18n.t('resume_failed', '恢复失败')),
                    d.success ? 'success' : 'error');
                refreshData();
            } catch (e) { showToast(I18n.t('resume_failed', '恢复失败'), 'error'); }
        };

        window.stopPlatform = async function(pid) {
            if (!confirm(I18n.t('confirm_stop_platform', '确定要停止该平台的刮削吗？'))) return;
            try {
                const r = await fetch('/api/scraper/platforms/' + pid + '/stop', { method: 'POST' });
                const d = await r.json();
                showToast(d.success ? I18n.t('stopped_platform', '已停止') : (d.message || I18n.t('stop_failed', '停止失败')),
                    d.success ? 'success' : 'error');
                refreshData();
            } catch (e) { showToast(I18n.t('stop_failed', '停止失败'), 'error'); }
        };

        // ========== 折叠控制 ==========
        window.togglePlatform = function(pid) {
            if (expandedPlatforms.has(pid)) {
                expandedPlatforms.delete(pid);
            } else {
                expandedPlatforms.add(pid);
            }
            renderPlatformCards(lastData);
        };

        // ========== 数据拉取 ==========
        let lastData = null;

        async function fetchProgress() {
            const r = await fetch('/api/scraper/platform-progress');
            const d = await r.json();
            return d.success ? d.data : null;
        }

        async function fetchQuota() {
            const r = await fetch('/api/scraper/thread-status');
            const d = await r.json();
            return d.success ? d.data : null;
        }

        async function refreshData() {
            if (refreshing) return;
            refreshing = true;
            try {
                const [progress, quota] = await Promise.all([fetchProgress(), fetchQuota()]);
                lastData = progress;
                updateQuotaBar(quota);
                updateGlobalControls(progress);
                renderPlatformCards(progress);
            } catch (e) {
                console.error('刷新失败:', e);
            } finally {
                refreshing = false;
            }
        }

        // ========== 配额面板 ==========
        function updateQuotaBar(data) {
            if (!data || !data.quota) return;
            const q = data.quota;
            const today = (q.requestsToday || 0).toLocaleString();
            const max = (q.maxRequestsPerDay || 0).toLocaleString();
            $('qRequests').textContent = today + ' / ' + max;
            const pct = q.usagePercent || 0;
            $('qPct').textContent = pct + '%';
            const bar = $('qBar');
            bar.style.width = pct + '%';
            if (pct >= 90) {
                bar.style.background = 'var(--accent-danger)';
                $('qPct').style.color = 'var(--accent-danger)';
            } else if (pct >= 70) {
                bar.style.background = 'var(--accent-warning)';
                $('qPct').style.color = 'var(--accent-warning)';
            } else {
                bar.style.background = 'var(--accent-success)';
                $('qPct').style.color = 'var(--accent-success)';
            }
            $('qThreads').textContent = data.maxThreads || '-';
            $('qLevel').textContent = q.userNiveau || '-';
        }

        // ========== 全局控制按钮状态 ==========
        function updateGlobalControls(data) {
            if (!data) return;
            lastGlobalPhase = data.globalPhase || '';
            lastIsPaused = data.isPaused || false;
            const btn = $('btnPauseAll');
            if (lastIsPaused || lastGlobalPhase === 'PAUSED') {
                btn.innerHTML = '<span class="btn-icon">▶️</span> <span data-i18n="btn_resume_all">' + I18n.t('btn_resume_all', '全部恢复') + '</span>';
                btn.className = 'btn btn-success';
                btn.onclick = resumeAll;
            } else {
                btn.innerHTML = '<span class="btn-icon">⏸️</span> <span data-i18n="btn_pause_all">' + I18n.t('btn_pause_all', '全部暂停') + '</span>';
                btn.className = 'btn btn-warning';
                btn.onclick = pauseAll;
            }
            // 全局阶段 badge
            const badge = $('globalPhaseBadge');
            badge.textContent = phaseLabel(lastGlobalPhase);
            badge.className = 'md-phase-badge ' + phaseClass(lastGlobalPhase);
        }

        window.resumeAll = async function() {
            try {
                const r = await fetch('/api/scraper/resume-all', { method: 'POST' });
                const d = await r.json();
                showToast(d.success ? I18n.t('resumed_all', '已恢复所有平台') : (d.message || I18n.t('resume_failed', '恢复失败')),
                    d.success ? 'success' : 'error');
                refreshData();
            } catch (e) { showToast(I18n.t('resume_failed', '恢复失败'), 'error'); }
        };

        // ========== 平台卡片渲染 ==========
        function renderPlatformCards(data) {
            const container = $('platformList');
            const empty = $('emptyState');
            if (!data || !data.platforms || data.platforms.length === 0) {
                container.style.display = 'none';
                empty.style.display = '';
                return;
            }
            container.style.display = '';
            empty.style.display = 'none';

            let html = '';
            for (const p of data.platforms) {
                const pid = p.platformId;
                const expanded = expandedPlatforms.has(pid);
                const phase = p.phase || 'WAITING';
                const isFinished = phase === 'COMPLETED' || phase === 'STOPPED';
                const isPaused = phase === 'PAUSED';
                const isActive = !isFinished && !isPaused;

                // 默认展开：进行中的平台展开，已完成折叠
                if (expanded && !expandedPlatforms.has(pid)) { /* skip */ }
                const show = expandedPlatforms.has(pid);

                html += '<div class="md-card' + (isActive ? ' md-card-active' : '') + (isFinished ? ' md-card-done' : '') + '">';

                // Card header
                html += '<div class="md-card-head" onclick="togglePlatform(' + pid + ')">';
                html += '<div class="md-card-head-left">';
                html += '<span class="md-chevron">' + (show ? '▼' : '▶') + '</span> ';
                html += '<span class="md-card-name">' + escapeHtml(p.platformName || 'Platform ' + pid) + '</span>';
                html += '<span class="md-phase-badge ' + phaseClass(phase) + '">' + phaseLabel(phase) + '</span>';
                html += '</div>';
                html += '<div class="md-card-head-right" onclick="event.stopPropagation()">';

                // 阶段摘要（折叠时可见）
                if (!show) {
                    html += '<span class="md-card-summary">';
                    if (phase === 'INFO_SCRAPING') {
                        html += (p.infoCompleted || 0) + '/' + (p.infoTotal || 0);
                    } else if (phase === 'MEDIA_DOWNLOAD') {
                        html += I18n.t('summary_media', '媒体') + ': ' + (p.mediaCompleted || 0) + '/' + (p.mediaTotal || 0);
                    } else if (phase === 'COMPLETED') {
                        html += I18n.t('summary_done', '完成');
                    }
                    html += '</span>';
                }

                // 操作按钮
                if (isActive) {
                    html += '<button class="btn btn-sm btn-warning" onclick="pausePlatform(' + pid + ')" title="' + I18n.t('btn_pause', '暂停') + '">⏸️</button>';
                    html += '<button class="btn btn-sm btn-danger" onclick="stopPlatform(' + pid + ')" title="' + I18n.t('btn_stop', '停止') + '">⏹️</button>';
                } else if (isPaused) {
                    html += '<button class="btn btn-sm btn-success" onclick="resumePlatform(' + pid + ')" title="' + I18n.t('btn_resume', '恢复') + '">▶️</button>';
                    html += '<button class="btn btn-sm btn-danger" onclick="stopPlatform(' + pid + ')" title="' + I18n.t('btn_stop', '停止') + '">⏹️</button>';
                }

                html += '</div></div>';

                // Card body (展开时显示)
                if (show) {
                    html += '<div class="md-card-body">';

                    // 当前阶段描述
                    if (phase === 'INFO_SCRAPING') {
                        html += '<div class="md-detail-row"><span class="md-detail-label">' + I18n.t('detail_phase', '阶段') + '</span>';
                        html += '<span class="md-detail-value">' + I18n.t('phase_info', '信息刮削') + ' (' + (p.infoCompleted||0) + '/' + (p.infoTotal||0) + ')</span></div>';
                    } else if (phase === 'MEDIA_DOWNLOAD') {
                        html += '<div class="md-detail-row"><span class="md-detail-label">' + I18n.t('detail_phase', '阶段') + '</span>';
                        html += '<span class="md-detail-value">' + I18n.t('phase_media', '媒体下载') + ' (' + (p.mediaCompleted||0) + '/' + (p.mediaTotal||0) + ')</span></div>';
                    }

                    // 当前游戏
                    if (p.currentGame) {
                        html += '<div class="md-detail-row"><span class="md-detail-label">' + I18n.t('detail_current', '当前') + '</span>';
                        html += '<span class="md-detail-value md-game-name">' + escapeHtml(p.currentGame) + '</span></div>';
                    }

                    // 统计行
                    html += '<div class="md-stats-row">';
                    // 信息刮削统计
                    html += '<div class="md-stat-group">';
                    html += '<div class="md-stat-group-title">' + I18n.t('group_info', '信息刮削') + '</div>';
                    html += '<div class="md-stat-cells">';
                    html += '<div class="md-stat-cell"><span class="md-stat-num md-stat-done">' + (p.infoCompleted||0) + '</span><span class="md-stat-lbl">' + I18n.t('completed_label', '完成') + '</span></div>';
                    html += '<div class="md-stat-cell">';
                    if (p.infoFailed > 0) {
                        html += '<a href="#" class="md-stat-num md-stat-fail md-fail-link" onclick="showFailedTasks(\'GAME_INFO\');return false;" title="' + I18n.t('failed_view', '查看失败任务') + '">' + p.infoFailed + '</a>';
                    } else {
                        html += '<span class="md-stat-num md-stat-fail">0</span>';
                    }
                    html += '<span class="md-stat-lbl">' + I18n.t('failed_label', '失败') + '</span></div>';
                    html += '</div></div>';
                    // 媒体下载统计
                    html += '<div class="md-stat-group">';
                    html += '<div class="md-stat-group-title">' + I18n.t('group_media', '媒体下载') + '</div>';
                    html += '<div class="md-stat-cells">';
                    html += '<div class="md-stat-cell"><span class="md-stat-num md-stat-done">' + (p.mediaCompleted||0) + '</span><span class="md-stat-lbl">' + I18n.t('completed_label', '完成') + '</span></div>';
                    html += '<div class="md-stat-cell"><span class="md-stat-num md-stat-pending">' + (p.mediaPending||0) + '</span><span class="md-stat-lbl">' + I18n.t('pending_label', '待处理') + '</span></div>';
                    html += '<div class="md-stat-cell">';
                    if (p.mediaFailed > 0) {
                        html += '<a href="#" class="md-stat-num md-stat-fail md-fail-link" onclick="showFailedTasks(\'MEDIA_DOWNLOAD\');return false;" title="' + I18n.t('failed_view', '查看失败任务') + '">' + p.mediaFailed + '</a>';
                    } else {
                        html += '<span class="md-stat-num md-stat-fail">0</span>';
                    }
                    html += '<span class="md-stat-lbl">' + I18n.t('failed_label', '失败') + '</span></div>';
                    html += '</div></div>';
                    html += '</div>';

                    // 进度条（信息刮削）
                    if (p.infoTotal > 0) {
                        const infoPct = Math.round((p.infoCompleted / p.infoTotal) * 100);
                        html += '<div class="md-progress-row"><span class="md-progress-label">' + I18n.t('progress_info', '信息进度') + '</span>';
                        html += '<div class="md-progress-track"><div class="md-progress-fill" style="width:' + infoPct + '%"></div></div>';
                        html += '<span class="md-progress-pct">' + infoPct + '%</span></div>';
                    }
                    // 进度条（媒体下载）
                    if (p.mediaTotal > 0) {
                        const mdPct = Math.round((p.mediaCompleted / p.mediaTotal) * 100);
                        html += '<div class="md-progress-row"><span class="md-progress-label">' + I18n.t('progress_media', '媒体进度') + '</span>';
                        html += '<div class="md-progress-track"><div class="md-progress-fill md-progress-media" style="width:' + mdPct + '%"></div></div>';
                        html += '<span class="md-progress-pct">' + mdPct + '%</span></div>';
                    }

                    html += '</div>'; // end card body
                }

                html += '</div>'; // end card
            }

            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // ========== 轮询 ==========
        const POLL_INTERVAL = 15000;
        let pollTimer = null;

        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(refreshData, POLL_INTERVAL);
        }

        function stopPolling() {
            if (!pollTimer) return;
            clearInterval(pollTimer);
            pollTimer = null;
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                stopPolling();
            } else {
                refreshData();
                startPolling();
            }
        });

        // ========== 失败任务弹窗（保留原有逻辑） ==========
        let _currentFailedTaskType = null;

        window.showFailedTasks = async function(taskType) {
            _currentFailedTaskType = taskType;
            const modal = $('failedTaskModal');
            const list = $('failedTaskList');
            const title = $('failedModalTitle');
            const clearBtn = $('ftClearAllBtn');

            title.textContent = '❗ ' + (taskType === 'GAME_INFO' ? I18n.t('failed_game_info', '游戏信息刮削失败') : I18n.t('failed_media', '媒体文件下载失败'));
            list.innerHTML = '<p class="ft-loading">' + I18n.t('failed_loading', '加载中...') + '</p>';
            clearBtn.style.display = 'none';
            modal.style.display = 'flex';

            try {
                const resp = await fetch('/api/scraper/failed-tasks?taskType=' + taskType);
                const result = await resp.json();
                if (!result.success || !result.data || result.data.length === 0) {
                    list.innerHTML = '<p class="ft-empty">' + I18n.t('failed_no_tasks', '暂无失败任务') + '</p>';
                    return;
                }
                clearBtn.style.display = '';
                let html = '<div class="ft-table-head">';
                html += '<div class="ft-th">' + I18n.t('failed_col_game', '游戏') + '</div>';
                html += '<div class="ft-th">' + I18n.t('failed_col_platform', '平台') + '</div>';
                html += '<div class="ft-th">' + I18n.t('failed_col_error', '错误') + '</div>';
                html += '<div class="ft-th" style="text-align:center;">' + I18n.t('failed_col_action', '操作') + '</div>';
                html += '</div>';
                for (const task of result.data) {
                    const gameName = task.gameName || task.romFilename || I18n.t('failed_unknown_game', '未知游戏');
                    const platformName = task.platformName || '-';
                    const errorMsg = (task.errorMessage || I18n.t('failed_unknown_error', '未知错误')).substring(0, 60);
                    const gameId = task.gameId;
                    const taskId = task.id;
                    const mediaType = task.mediaType;
                    html += '<div class="ft-task-row" id="ft-row-' + taskId + '">';
                    html += '<div class="ft-game-name">';
                    if (gameId) html += '<a href="/game-edit?id=' + gameId + '">' + escapeHtml(gameName) + '</a>';
                    else html += escapeHtml(gameName);
                    html += '</div>';
                    html += '<div class="ft-platform">' + escapeHtml(platformName);
                    if (mediaType) html += ' <span class="ft-media-tag">' + escapeHtml(mediaType) + '</span>';
                    html += '</div>';
                    html += '<div class="ft-error" title="' + escapeHtml(task.errorMessage || '') + '">' + escapeHtml(errorMsg) + '</div>';
                    html += '<div class="ft-action-btns">';
                    html += '<button class="ft-retry-btn" onclick="retryTask(' + taskId + ',\'' + taskType + '\')">' + I18n.t('failed_retry', '重试') + '</button>';
                    html += '<button class="ft-delete-btn" onclick="deleteFailedTask(' + taskId + ',\'' + taskType + '\')">' + I18n.t('failed_delete', '删除') + '</button>';
                    html += '</div></div>';
                }
                list.innerHTML = html;
            } catch (e) {
                list.innerHTML = '<p class="ft-error-msg">' + I18n.t('failed_load_error', '加载失败') + ': ' + e.message + '</p>';
            }
        };

        window.closeFailedTaskModal = function() {
            $('failedTaskModal').style.display = 'none';
        };

        window.retryTask = async function(taskId, taskType) {
            try {
                const r = await fetch('/api/scraper/retry-task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId: taskId })
                });
                const d = await r.json();
                if (d.success) { showFailedTasks(taskType); refreshData(); }
                else showToast(d.message || I18n.t('failed_retry_error', '重试失败'), 'error');
            } catch (e) { showToast(I18n.t('failed_retry_error', '重试失败'), 'error'); }
        };

        window.deleteFailedTask = async function(taskId, taskType) {
            try {
                const r = await fetch('/api/scraper/failed-tasks/' + taskId, { method: 'DELETE' });
                const d = await r.json();
                if (d.success) {
                    const row = document.getElementById('ft-row-' + taskId);
                    if (row) { row.style.opacity = '0'; setTimeout(() => row.remove(), 200); }
                    const remaining = document.querySelectorAll('.ft-task-row');
                    if (remaining.length <= 1) { showFailedTasks(taskType); refreshData(); }
                } else showToast(d.message || I18n.t('failed_delete_error', '删除失败'), 'error');
            } catch (e) { showToast(I18n.t('failed_delete_error', '删除失败'), 'error'); }
        };

        window.clearAllFailedTasks = async function() {
            if (!_currentFailedTaskType) return;
            if (!confirm(I18n.t('failed_clear_confirm', '确定清除所有失败任务？'))) return;
            try {
                const r = await fetch('/api/scraper/failed-tasks?taskType=' + _currentFailedTaskType, { method: 'DELETE' });
                const d = await r.json();
                if (d.success) {
                    showToast(I18n.t('failed_cleared', '已清除') + ' ' + (d.deletedCount || 0) + ' ' + I18n.t('failed_cleared_unit', '条'), 'success');
                    showFailedTasks(_currentFailedTaskType);
                    refreshData();
                } else showToast(d.message || I18n.t('failed_clear_error', '清除失败'), 'error');
            } catch (e) { showToast(I18n.t('failed_clear_error', '清除失败'), 'error'); }
        };

        // 点击弹窗外部关闭
        document.addEventListener('click', function(e) {
            const modal = $('failedTaskModal');
            if (modal && e.target === modal) closeFailedTaskModal();
        });

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            refreshData();
            startPolling();
        });

    })();
    </script>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: notification-modal}"></div>
    <script>
        function openNotificationPanel() {
            document.getElementById('notificationModal').style.display = 'block';
        }
        function closeNotificationPanel() {
            document.getElementById('notificationModal').style.display = 'none';
        }
    </script>
    <div th:replace="~{fragments/layout :: common-scripts}"></div>
</body>
</html>
