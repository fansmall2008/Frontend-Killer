<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="media_download_mgmt_title">媒体下载管理 - 前端杀手</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/media-download.css}">
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/layout :: sidebar('media')}"></div>
        <div class="main-area">
            <div th:replace="~{fragments/layout :: header('MEDIA_DOWNLOAD')}"></div>
            <main class="content">

    <div class="pg-container">

        <div class="btn-group">
            <button class="btn btn-danger" onclick="stopAllDownloads()" data-i18n="stop_all_scrape">⏹️ 停止所有刮削</button>
            <button class="btn" onclick="refreshPlatforms()" data-i18n="refresh_status">🔄 刷新状态</button>
        </div>

        <!-- 游戏信息刮削状态卡片 -->
        <div class="platform-card pg-scrape-card">
            <div class="platform-header">
                <div class="platform-name" data-i18n="game_info_scrape">🎮 游戏信息刮削</div>
                <span class="platform-status" id="scrapingStatusBadge" data-i18n="status_idle">空闲</span>
            </div>
            
            <div class="platform-stats">
                <div class="stat-item pending">
                    <div class="stat-label" data-i18n="pending_label">待处理</div>
                    <div class="stat-value" id="pendingGames">0</div>
                </div>
                <div class="stat-item downloading">
                    <div class="stat-label" data-i18n="processing_label">处理中</div>
                    <div class="stat-value" id="processingGames">0</div>
                </div>
                <div class="stat-item completed">
                    <div class="stat-label" data-i18n="completed_label">已完成</div>
                    <div class="stat-value" id="scrapedGames">0</div>
                </div>
            </div>

            <div class="platform-stats">
                <div class="stat-item failed" style="cursor:pointer" onclick="showFailedTasks('GAME_INFO')">
                    <div class="stat-label" data-i18n="failed_label">失败</div>
                    <div class="stat-value" id="failedGames">0</div>
                </div>
                <div class="stat-item stopped">
                    <div class="stat-label" data-i18n="stopped_label">已停止</div>
                    <div class="stat-value" id="stoppedGames">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="total_count_label">总计</div>
                    <div class="stat-value" id="totalGames">0</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="scrapingProgressFill" style="width: 0%"></div>
            </div>
            <div class="pg-progress-text"><span data-i18n="progress_label">进度</span>: <span id="scrapingProgress">0%</span></div>

            <div class="platform-actions">
                <button class="btn btn-warning" id="pauseScrapingBtn" onclick="pauseScraping()" style="display: none;" data-i18n="btn_pause">⏸️ 暂停</button>
                <button class="btn btn-success" id="resumeScrapingBtn" onclick="resumeScraping()" style="display: none;" data-i18n="btn_resume">▶️ 恢复</button>
                <button class="btn btn-danger" id="stopScrapingBtn" onclick="stopScraping()" style="display: none;" data-i18n="btn_stop">⏹️ 停止</button>
                <button class="btn btn-danger" id="deleteScrapingTaskBtn" onclick="deleteScrapingTask()" style="display: none;" data-i18n="btn_delete_task">🗑️ 删除任务</button>
            </div>
        </div>

        <!-- 媒体下载状态卡片 -->
        <div class="platform-card pg-scrape-card">
            <div class="platform-header">
                <div class="platform-name" data-i18n="media_download_status">🖼️ 媒体文件下载</div>
                <span class="platform-status" id="mediaStatusBadge" data-i18n="status_idle">空闲</span>
            </div>
            
            <div class="platform-stats">
                <div class="stat-item pending">
                    <div class="stat-label" data-i18n="pending_label">待处理</div>
                    <div class="stat-value" id="mediaPending">0</div>
                </div>
                <div class="stat-item downloading">
                    <div class="stat-label" data-i18n="processing_label">处理中</div>
                    <div class="stat-value" id="mediaProcessing">0</div>
                </div>
                <div class="stat-item completed">
                    <div class="stat-label" data-i18n="completed_label">已完成</div>
                    <div class="stat-value" id="mediaCompleted">0</div>
                </div>
            </div>

            <div class="platform-stats">
                <div class="stat-item failed" style="cursor:pointer" onclick="showFailedTasks('MEDIA_DOWNLOAD')">
                    <div class="stat-label" data-i18n="failed_label">失败</div>
                    <div class="stat-value" id="mediaFailed">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="total_count_label">总计</div>
                    <div class="stat-value" id="mediaTotal">0</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="mediaProgressFill" style="width: 0%"></div>
            </div>
            <div class="pg-progress-text"><span data-i18n="progress_label">进度</span>: <span id="mediaProgress">0%</span></div>
        </div>

        <!-- ScreenScraper 配额信息面板 -->
        <div class="quota-panel">
            <div class="quota-header">
                <h3 class="quota-title" data-i18n="quota_info_title">📊 ScreenScraper 配额信息</h3>
                <span id="quotaUpdateTime" class="quota-time" data-i18n="quota_waiting">等待数据...</span>
            </div>
            <div class="quota-grid">
                <div class="quota-cell">
                    <div class="quota-label" data-i18n="quota_today_requests">今日请求</div>
                    <div class="quota-value gold" id="quotaRequestsToday">-</div>
                </div>
                <div class="quota-cell">
                    <div class="quota-label" data-i18n="quota_daily_limit">每日上限</div>
                    <div class="quota-value cyan" id="quotaMaxPerDay">-</div>
                </div>
                <div class="quota-cell">
                    <div class="quota-label" data-i18n="quota_usage_rate">使用率</div>
                    <div class="quota-value" id="quotaUsagePercent">-</div>
                </div>
                <div class="quota-cell">
                    <div class="quota-label" data-i18n="quota_threads">并发线程</div>
                    <div class="quota-value cyan" id="quotaMaxThreads">-</div>
                </div>
                <div class="quota-cell">
                    <div class="quota-label" data-i18n="quota_user_level">用户等级</div>
                    <div class="quota-value plain" id="quotaUserNiveau">-</div>
                </div>
                <div class="quota-cell">
                    <div class="quota-label" data-i18n="quota_contrib_level">贡献等级</div>
                    <div class="quota-value plain" id="quotaUserContribution">-</div>
                </div>
            </div>
            <!-- 配额进度条 -->
            <div class="quota-progress-wrap">
                <div class="quota-progress-head">
                    <span data-i18n="quota_usage_progress">配额使用进度</span>
                    <span id="quotaProgressText">0 / 0</span>
                </div>
                <div class="quota-progress-track">
                    <div id="quotaProgressBar" class="quota-progress-fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="label" data-i18n="total_platforms">平台总数</div>
                <div class="value" id="totalPlatforms">0</div>
            </div>
            <div class="status-item downloading">
                <div class="label" data-i18n="scraping_now">正在刮削</div>
                <div class="value" id="totalDownloading">0</div>
            </div>
            <div class="status-item completed">
                <div class="label" data-i18n="completed_label">已完成</div>
                <div class="value" id="totalCompleted">0</div>
            </div>
            <div class="status-item failed">
                <div class="label" data-i18n="failed_label">失败</div>
                <div class="value" id="totalFailed">0</div>
            </div>
            <div class="status-item stopped">
                <div class="label" data-i18n="stopped_label">已停止</div>
                <div class="value" id="totalStopped">0</div>
            </div>
        </div>

        <div id="platformGrid" class="platform-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p data-i18n="loading_text">加载中...</p>
            </div>
        </div>
    </div>

    
    <script>
        let platforms = [];

        // 获取游戏信息刮削状态
        async function fetchScrapingStatus() {
            try {
                const response = await fetch('/api/scraper/status');
                const data = await response.json();
                if (data.success && data.data) {
                    return data.data;
                }
                return { isRunning: false, scrapedCount: 0, totalCount: 0 };
            } catch (error) {
                console.error('获取刮削状态失败:', error);
                return { isRunning: false, scrapedCount: 0, totalCount: 0 };
            }
        }

        // 更新游戏信息刮削状态显示
        async function updateScrapingStatus() {
            const status = await fetchScrapingStatus();
            
            // === 游戏信息卡片：使用分类统计 ===
            const giPending = status.gameInfoPending || 0;
            const giRunning = status.gameInfoRunning || 0;
            const giCompleted = status.gameInfoCompleted || 0;
            const giFailed = status.gameInfoFailed || 0;
            const giTotal = giPending + giRunning + giCompleted + giFailed;
            const giProgress = giTotal > 0 ? Math.round((giCompleted / giTotal) * 100) : 0;

            // 更新状态徽章
            const statusBadge = document.getElementById('scrapingStatusBadge');
            const isPaused = status.isPaused === true;
            const isRunning = status.isRunning === true && !isPaused;
            
            let statusText, statusClass;
            if (isRunning) {
                statusText = '运行中';
                statusClass = 'running';
            } else if (isPaused) {
                statusText = I18n.t('status_paused', '已暂停');
                statusClass = 'stopped';
            } else {
                statusText = I18n.t('status_idle', '空闲');
                statusClass = 'idle';
            }
            
            statusBadge.textContent = statusText;
            statusBadge.className = `platform-status ${statusClass}`;

            // 更新游戏信息统计数据
            document.getElementById('pendingGames').textContent = giPending;
            document.getElementById('processingGames').textContent = giRunning;
            document.getElementById('scrapedGames').textContent = giCompleted;
            document.getElementById('failedGames').textContent = giFailed;
            document.getElementById('stoppedGames').textContent = status.stoppedCount || 0;
            document.getElementById('totalGames').textContent = giTotal;
            document.getElementById('scrapingProgress').textContent = `${giProgress}%`;
            document.getElementById('scrapingProgressFill').style.width = `${giProgress}%`;

            // === 媒体下载卡片：使用分类统计 ===
            const mdPending = status.mediaPending || 0;
            const mdRunning = status.mediaRunning || 0;
            const mdCompleted = status.mediaCompleted || 0;
            const mdFailed = status.mediaFailed || 0;
            const mdTotal = mdPending + mdRunning + mdCompleted + mdFailed;
            const mdProgress = mdTotal > 0 ? Math.round((mdCompleted / mdTotal) * 100) : 0;

            // 更新媒体状态徽章
            const mediaBadge = document.getElementById('mediaStatusBadge');
            const mediaIsRunning = mdRunning > 0;
            const mediaHasPending = mdPending > 0;
            
            let mediaText, mediaClass;
            if (mediaIsRunning) {
                mediaText = '下载中';
                mediaClass = 'running';
            } else if (mediaHasPending && isRunning) {
                mediaText = '等待中';
                mediaClass = 'stopped';
            } else {
                mediaText = I18n.t('status_idle', '空闲');
                mediaClass = 'idle';
            }
            
            mediaBadge.textContent = mediaText;
            mediaBadge.className = `platform-status ${mediaClass}`;

            // 更新媒体统计数据
            document.getElementById('mediaPending').textContent = mdPending;
            document.getElementById('mediaProcessing').textContent = mdRunning;
            document.getElementById('mediaCompleted').textContent = mdCompleted;
            document.getElementById('mediaFailed').textContent = mdFailed;
            document.getElementById('mediaTotal').textContent = mdTotal;
            document.getElementById('mediaProgress').textContent = `${mdProgress}%`;
            document.getElementById('mediaProgressFill').style.width = `${mdProgress}%`;

            // 更新按钮显示状态
            updateScrapingButtons(isRunning, isPaused);
            
            // 更新配额信息
            updateQuotaInfo();
        }

        // 更新配额信息显示
        async function updateQuotaInfo() {
            try {
                const response = await fetch('/api/scraper/thread-status');
                const data = await response.json();
                if (data.success && data.data && data.data.quota) {
                    const quota = data.data.quota;
                    const maxThreads = data.data.maxThreads;
                    
                    // 更新配额数据
                    document.getElementById('quotaRequestsToday').textContent = quota.requestsToday.toLocaleString();
                    document.getElementById('quotaMaxPerDay').textContent = quota.maxRequestsPerDay.toLocaleString();
                    document.getElementById('quotaMaxThreads').textContent = maxThreads;
                    document.getElementById('quotaUserNiveau').textContent = quota.userNiveau || '-';
                    document.getElementById('quotaUserContribution').textContent = quota.userContribution || '-';
                    
                    // 更新使用率
                    const usagePercent = quota.usagePercent || 0;
                    const usageElement = document.getElementById('quotaUsagePercent');
                    usageElement.textContent = usagePercent + '%';
                    
                    // 根据使用率设置颜色
                    if (usagePercent >= 90) {
                        usageElement.style.color = 'var(--accent-danger)'; // 红色 - 危险
                    } else if (usagePercent >= 70) {
                        usageElement.style.color = 'var(--accent-warning)'; // 橙色 - 警告
                    } else {
                        usageElement.style.color = 'var(--accent-success)'; // 绿色 - 正常
                    }
                    
                    // 更新进度条
                    document.getElementById('quotaProgressBar').style.width = usagePercent + '%';
                    document.getElementById('quotaProgressText').textContent = 
                        `${quota.requestsToday.toLocaleString()} / ${quota.maxRequestsPerDay.toLocaleString()}`;
                    
                    // 更新进度条颜色（高使用率时变红）
                    const progressBar = document.getElementById('quotaProgressBar');
                    if (usagePercent >= 90) {
                        progressBar.style.background = 'linear-gradient(90deg, var(--accent-warning), var(--accent-danger))';
                    } else if (usagePercent >= 70) {
                        progressBar.style.background = 'linear-gradient(90deg, var(--accent-secondary), var(--accent-warning))';
                    } else {
                        progressBar.style.background = 'linear-gradient(90deg, var(--accent-secondary), var(--accent-retro-yellow))';
                    }
                    
                    // 更新时间
                    const now = new Date();
                    document.getElementById('quotaUpdateTime').textContent = 
                        `更新于 ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                }
            } catch (error) {
                console.error('获取配额信息失败:', error);
            }
        }

        // 更新刮削按钮状态
        function updateScrapingButtons(isRunning, isPaused) {
            const pauseBtn = document.getElementById('pauseScrapingBtn');
            const resumeBtn = document.getElementById('resumeScrapingBtn');
            const stopBtn = document.getElementById('stopScrapingBtn');
            const deleteBtn = document.getElementById('deleteScrapingTaskBtn');

            if (isRunning) {
                // 运行中：显示暂停和停止按钮
                pauseBtn.style.display = 'block';
                resumeBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                deleteBtn.style.display = 'none';
            } else if (isPaused) {
                // 已暂停：显示恢复和停止按钮
                pauseBtn.style.display = 'none';
                resumeBtn.style.display = 'block';
                stopBtn.style.display = 'block';
                deleteBtn.style.display = 'none';
            } else {
                // 空闲：隐藏所有按钮
                pauseBtn.style.display = 'none';
                resumeBtn.style.display = 'none';
                stopBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
            }
        }

        // 暂停游戏信息刮削
        async function pauseScraping() {
            try {
                const response = await fetch('/api/scraper/pause', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削已暂停', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('pause_failed', '暂停失败'), 'error');
                }
            } catch (error) {
                console.error('暂停游戏信息刮削失败:', error);
                showToast(I18n.t('pause_failed', '暂停失败'), 'error');
            }
        }

        // 恢复游戏信息刮削
        async function resumeScraping() {
            try {
                const response = await fetch('/api/scraper/resume', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削已恢复', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('resume_failed', '恢复失败'), 'error');
                }
            } catch (error) {
                console.error('恢复游戏信息刮削失败:', error);
                showToast(I18n.t('resume_failed', '恢复失败'), 'error');
            }
        }

        // 停止游戏信息刮削
        async function stopScraping() {
            if (!confirm('确定要停止游戏信息刮削吗？')) {
                return;
            }
            
            try {
                const response = await fetch('/api/scraper/stop', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削已停止', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (error) {
                console.error('停止游戏信息刮削失败:', error);
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        }

        // 删除游戏信息刮削任务
        async function deleteScrapingTask() {
            if (!confirm('确定要删除游戏信息刮削任务吗？')) {
                return;
            }
            
            try {
                const response = await fetch('/api/scraper/delete', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削任务已删除', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('delete_failed', '删除失败'), 'error');
                }
            } catch (error) {
                console.error('删除游戏信息刮削任务失败:', error);
                showToast(I18n.t('delete_failed', '删除失败'), 'error');
            }
        }

        // 平台名称缓存：一次拉取全量 /api/platforms，避免 N+1 单查
        let platformNameCache = new Map();
        let platformNameCacheAt = 0;
        const PLATFORM_NAME_CACHE_TTL = 60000; // 60s

        async function ensurePlatformNameCache(force) {
            const now = Date.now();
            if (!force && platformNameCache.size > 0 && (now - platformNameCacheAt) < PLATFORM_NAME_CACHE_TTL) {
                return;
            }
            try {
                const response = await fetch('/api/platforms');
                if (!response.ok) return;
                const list = await response.json();
                if (Array.isArray(list)) {
                    const map = new Map();
                    for (const p of list) {
                        if (p && p.id != null) map.set(Number(p.id), p.name || `平台 ${p.id}`);
                    }
                    platformNameCache = map;
                    platformNameCacheAt = now;
                }
            } catch (error) {
                console.error('拉取平台列表失败:', error);
            }
        }

        // 一次性拉取所有平台的统计汇总
        async function fetchPlatformsSummary() {
            try {
                const response = await fetch('/api/media-download/platforms/summary');
                const data = await response.json();
                if (data.success && Array.isArray(data.data)) {
                    return data.data;
                }
                return [];
            } catch (error) {
                console.error('获取平台汇总失败:', error);
                return [];
            }
        }

        function getPlatformStatus(stats) {
            if (stats.stopped > 0 && stats.pending === 0 && stats.downloading === 0) {
                return 'stopped';
            } else if (stats.downloading > 0) {
                return 'running';
            } else if (stats.pending > 0) {
                // 有 PENDING 任务但无下载进行中（重启后恢复/额度耗尽后等待恢复）
                return 'waiting';
            } else {
                return 'idle';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'running': return '运行中';
                case 'stopped': return '已停止';
                case 'waiting': return '等待中';
                case 'idle': return '空闲';
                default: return '未知';
            }
        }

        function getProgress(stats) {
            const total = stats.total || 1;
            const completed = stats.completed || 0;
            return Math.round((completed / total) * 100);
        }

        function buildPlatformCard(platformId, stats) {
            const platformName = platformNameCache.get(Number(platformId)) || `平台 ${platformId}`;
            const status = getPlatformStatus(stats);
            const progress = getProgress(stats);

            return `
                <div class="platform-card">
                    <div class="platform-header">
                        <div class="platform-name">${platformName}</div>
                        <span class="platform-status ${status}">${getStatusText(status)}</span>
                    </div>
                    
                    <div class="platform-stats">
                        <div class="stat-item pending">
                            <div class="stat-label" data-i18n="pending_download">待下载</div>
                            <div class="stat-value">${stats.pending || 0}</div>
                        </div>
                        <div class="stat-item downloading">
                            <div class="stat-label" data-i18n="downloading_label">下载中</div>
                            <div class="stat-value">${stats.downloading || 0}</div>
                        </div>
                        <div class="stat-item completed">
                            <div class="stat-label" data-i18n="completed_label">已完成</div>
                            <div class="stat-value">${stats.completed || 0}</div>
                        </div>
                    </div>

                    <div class="platform-stats">
                        <div class="stat-item failed">
                            <div class="stat-label" data-i18n="failed_label">失败</div>
                            <div class="stat-value">${stats.failed || 0}</div>
                        </div>
                        <div class="stat-item stopped">
                            <div class="stat-label" data-i18n="stopped_label">已停止</div>
                            <div class="stat-value">${stats.stopped || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label" data-i18n="total_count_label">总计</div>
                            <div class="stat-value">${stats.total || 0}</div>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="pg-progress-text">进度: ${progress}%</div>

                    <div class="platform-actions">
                        ${status === 'stopped' || status === 'waiting' ? `
                            <button class="btn btn-success" onclick="resumePlatform(${platformId})">▶️ 恢复</button>
                        ` : `
                            <button class="btn btn-danger" onclick="stopPlatform(${platformId})">⏹️ 停止</button>
                        `}
                        <button class="btn btn-danger" onclick="deletePlatformScrapeTask(${platformId})">🗑️ 删除任务</button>
                    </div>
                </div>
            `;
        }

        // 刷新主流程：固定 3 个请求（scraper/status + thread-status + platforms/summary）
        // + 首次或缓存过期时 1 个 /api/platforms。不再随平台数量线性增长。
        let refreshing = false;
        async function refreshPlatforms() {
            if (refreshing) return; // 重入保护：上一轮未完成则跳过
            refreshing = true;
            try {
                // 并行拉取，不再串行 await
                const [summaryPromise, namePromise, scrapingPromise] = [
                    fetchPlatformsSummary(),
                    ensurePlatformNameCache(false),
                    updateScrapingStatus()
                ];
                const summary = await summaryPromise;
                await namePromise;
                await scrapingPromise;

                const platformGrid = document.getElementById('platformGrid');

                if (!summary || summary.length === 0) {
                    platformGrid.innerHTML = `
                        <div class="empty-state">
                            <h3>📭 暂无媒体下载任务</h3>
                            <p>当前没有需要刮削的媒体文件，请先执行刮削任务</p>
                        </div>
                    `;
                    updateTotalStats({ total: 0, downloading: 0, completed: 0, failed: 0, stopped: 0 });
                    return;
                }

                // 卡片渲染 + 汇总统计一次遍历完成，不再二次拉取
                let total = 0, downloading = 0, completed = 0, failed = 0, stopped = 0;
                const cards = [];
                for (const s of summary) {
                    const pid = s.platformId;
                    const stats = {
                        total: s.total || 0,
                        pending: s.pending || 0,
                        downloading: s.downloading || 0,
                        completed: s.completed || 0,
                        failed: s.failed || 0,
                        stopped: s.stopped || 0
                    };
                    cards.push(buildPlatformCard(pid, stats));
                    total++;
                    downloading += stats.downloading;
                    completed   += stats.completed;
                    failed      += stats.failed;
                    stopped     += stats.stopped;
                }
                platformGrid.innerHTML = cards.join('');
                updateTotalStats({ total, downloading, completed, failed, stopped });
            } catch (err) {
                console.error('刷新媒体下载页面失败:', err);
            } finally {
                refreshing = false;
            }
        }

        function updateTotalStats(stats) {
            document.getElementById('totalPlatforms').textContent = stats.total;
            document.getElementById('totalDownloading').textContent = stats.downloading;
            document.getElementById('totalCompleted').textContent = stats.completed;
            document.getElementById('totalFailed').textContent = stats.failed;
            document.getElementById('totalStopped').textContent = stats.stopped;
        }

        async function stopPlatform(platformId) {
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/stop`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('平台刮削已停止', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (error) {
                console.error('停止平台刮削失败:', error);
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        }

        async function resumePlatform(platformId) {
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/resume`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('平台刮削已恢复', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('resume_failed', '恢复失败'), 'error');
                }
            } catch (error) {
                console.error('恢复平台刮削失败:', error);
                showToast(I18n.t('resume_failed', '恢复失败'), 'error');
            }
        }
        
        async function deletePlatformScrapeTask(platformId) {
            if (!confirm('确定要删除该平台的所有刮削任务吗？这将清除该平台的所有刮削队列。')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/delete`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('平台刮削任务已删除', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('delete_failed', '删除失败'), 'error');
                }
            } catch (error) {
                console.error('删除平台刮削任务失败:', error);
                showToast(I18n.t('delete_failed', '删除失败'), 'error');
            }
        }

        async function stopAllDownloads() {
            if (!confirm('确定要停止所有平台的刮削吗？')) {
                return;
            }
            
            try {
                const response = await fetch('/api/media-download/platforms/stop-all', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('所有平台刮削已停止', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (error) {
                console.error('停止所有平台刮削失败:', error);
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', refreshPlatforms);

        // 轮询间隔：15s（原 10s 在多平台下容易堆积）；页面不可见时暂停，避免后台标签持续消耗连接与数据库资源。
        const REFRESH_INTERVAL_MS = 15000;
        let refreshTimer = null;

        function startRefreshTimer() {
            if (refreshTimer) return;
            refreshTimer = setInterval(refreshPlatforms, REFRESH_INTERVAL_MS);
        }
        function stopRefreshTimer() {
            if (!refreshTimer) return;
            clearInterval(refreshTimer);
            refreshTimer = null;
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopRefreshTimer();
            } else {
                // 回到前台时立即刷新一次并重启轮询
                refreshPlatforms();
                startRefreshTimer();
            }
        });

        startRefreshTimer();
    </script>

    <!-- 失败任务弹窗 -->
    <!-- 失败任务弹窗 -->
    <div id="failedTaskModal" class="ft-modal-overlay" style="display:none;">
        <div class="ft-modal">
            <div class="ft-modal-header">
                <h3 id="failedModalTitle">❗ 失败任务</h3>
                <div class="ft-header-actions">
                    <button id="ftClearAllBtn" class="ft-clear-all-btn" onclick="clearAllFailedTasks()" style="display:none;" data-i18n="failed_clear_all">清除全部</button>
                    <button class="ft-modal-close" onclick="closeFailedTaskModal()">&times;</button>
                </div>
            </div>
            <div id="failedTaskList" class="ft-modal-body">
                <p class="ft-loading" data-i18n="failed_loading">加载中...</p>
            </div>
        </div>
    </div>
    <script>
        let _currentFailedTaskType = null;

        async function showFailedTasks(taskType) {
            _currentFailedTaskType = taskType;
            const modal = document.getElementById('failedTaskModal');
            const list = document.getElementById('failedTaskList');
            const title = document.getElementById('failedModalTitle');
            const clearBtn = document.getElementById('ftClearAllBtn');

            const titleKey = taskType === 'GAME_INFO' ? 'failed_game_info' : 'failed_media_download';
            title.textContent = I18n.t(titleKey, taskType === 'GAME_INFO' ? '❗ 游戏信息刮削失败' : '❗ 媒体文件下载失败');
            list.innerHTML = '<p class="ft-loading">' + I18n.t('failed_loading', '加载中...') + '</p>';
            clearBtn.style.display = 'none';
            modal.style.display = 'flex';

            try {
                const resp = await fetch(`/api/scraper/failed-tasks?taskType=${taskType}`);
                const result = await resp.json();
                if (!result.success || !result.data || result.data.length === 0) {
                    list.innerHTML = '<p class="ft-empty">' + I18n.t('failed_no_tasks', '暂无失败任务') + '</p>';
                    return;
                }

                // Show clear-all button when there are tasks
                clearBtn.style.display = '';

                // Table header
                let html = '<div class="ft-table-head">';
                html += '<div class="ft-th">' + I18n.t('failed_col_game', '游戏') + '</div>';
                html += '<div class="ft-th">' + I18n.t('failed_col_platform', '平台') + '</div>';
                html += '<div class="ft-th">' + I18n.t('failed_col_error', '错误') + '</div>';
                html += '<div class="ft-th" style="text-align:center;">' + I18n.t('failed_col_action', '操作') + '</div>';
                html += '</div>';

                // Task rows
                for (const task of result.data) {
                    const gameName = task.gameName || task.romFilename || I18n.t('failed_unknown_game', '未知游戏');
                    const platformName = task.platformName || '-';
                    const errorMsg = (task.errorMessage || I18n.t('failed_unknown_error', '未知错误')).substring(0, 60);
                    const gameId = task.gameId;
                    const taskId = task.id;
                    const mediaType = task.mediaType;

                    html += '<div class="ft-task-row" id="ft-row-' + taskId + '">';
                    // Game name
                    html += '<div class="ft-game-name">';
                    if (gameId) {
                        html += '<a href="/game-edit?id=' + gameId + '" title="' + I18n.t('failed_open_game', '打开游戏编辑页') + '">' + gameName + '</a>';
                    } else {
                        html += gameName;
                    }
                    html += '</div>';
                    // Platform + media type tag
                    html += '<div class="ft-platform">' + platformName;
                    if (mediaType) {
                        html += ' <span class="ft-media-tag">' + mediaType + '</span>';
                    }
                    html += '</div>';
                    // Error message
                    html += '<div class="ft-error" title="' + (task.errorMessage || '').replace(/"/g, '&quot;') + '">' + errorMsg + '</div>';
                    // Action buttons
                    html += '<div class="ft-action-btns">';
                    html += '<button class="ft-retry-btn" onclick="retryTask(' + taskId + ',\'' + taskType + '\')">' + I18n.t('failed_retry', '重试') + '</button>';
                    html += '<button class="ft-delete-btn" onclick="deleteFailedTask(' + taskId + ',\'' + taskType + '\')">' + I18n.t('failed_delete', '删除') + '</button>';
                    html += '</div>';
                    html += '</div>';
                }
                list.innerHTML = html;
            } catch (e) {
                list.innerHTML = '<p class="ft-error-msg">' + I18n.t('failed_load_error', '加载失败') + ': ' + e.message + '</p>';
            }
        }

        function closeFailedTaskModal() {
            document.getElementById('failedTaskModal').style.display = 'none';
        }

        async function retryTask(taskId, taskType) {
            try {
                const resp = await fetch('/api/scraper/retry-task', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({taskId: taskId})
                });
                const result = await resp.json();
                if (result.success) {
                    showFailedTasks(taskType);
                    refreshPlatforms();
                } else {
                    showToast(result.message || I18n.t('failed_retry_error', '重试请求失败'), 'error');
                }
            } catch (e) {
                showToast(I18n.t('failed_retry_error', '重试请求失败') + ': ' + e.message, 'error');
            }
        }

        async function deleteFailedTask(taskId, taskType) {
            try {
                const resp = await fetch(`/api/scraper/failed-tasks/${taskId}`, { method: 'DELETE' });
                const result = await resp.json();
                if (result.success) {
                    const row = document.getElementById('ft-row-' + taskId);
                    if (row) { row.style.opacity = '0'; setTimeout(() => row.remove(), 200); }
                    // Check if no more rows
                    const remaining = document.querySelectorAll('.ft-task-row');
                    if (remaining.length <= 1) { showFailedTasks(taskType); refreshPlatforms(); }
                } else {
                    showToast(result.message || I18n.t('failed_delete_error', '删除失败'), 'error');
                }
            } catch (e) {
                showToast(I18n.t('failed_delete_error', '删除失败') + ': ' + e.message, 'error');
            }
        }

        async function clearAllFailedTasks() {
            if (!_currentFailedTaskType) return;
            if (!confirm(I18n.t('failed_clear_confirm', '确定清除所有失败任务？'))) return;
            try {
                const resp = await fetch(`/api/scraper/failed-tasks?taskType=${_currentFailedTaskType}`, { method: 'DELETE' });
                const result = await resp.json();
                if (result.success) {
                    showToast(I18n.t('failed_cleared', '已清除') + ' ' + (result.deletedCount || 0) + ' ' + I18n.t('failed_cleared_unit', '条失败任务'), 'success');
                    showFailedTasks(_currentFailedTaskType);
                    refreshPlatforms();
                } else {
                    showToast(result.message || I18n.t('failed_clear_error', '清除失败'), 'error');
                }
            } catch (e) {
                showToast(I18n.t('failed_clear_error', '清除失败') + ': ' + e.message, 'error');
            }
        }

        // 点击弹窗外部关闭
        document.getElementById('failedTaskModal').addEventListener('click', function(e) {
            if (e.target === this) closeFailedTaskModal();
        });
    </script>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: notification-modal}"></div>
    <script>
        function openNotificationPanel() {
            document.getElementById('notificationModal').style.display = 'block';
        }
        function closeNotificationPanel() {
            document.getElementById('notificationModal').style.display = 'none';
        }
    </script>
