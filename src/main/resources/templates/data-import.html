<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend-Killer · Data Import</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div th:replace="~{fragments/layout :: sidebar('import')}"></div>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Header -->
            <div th:replace="~{fragments/layout :: header('DATA_IMPORT')}"></div>

            <!-- Content -->
            <main class="content">
                <div class="import-container">

                    <!-- Scan Settings -->
                    <div class="form-card">
                        <div class="form-card-title" data-i18n="scan_settings">扫描路径设置</div>
                        <form id="scanForm">
                            <!-- Path -->
                            <div class="form-group">
                                <label for="path" data-i18n="scan_path_label">请输入要扫描的根路径：</label>
                                <input type="text" id="path" name="path" placeholder="/roms" value="/roms" required>
                                <button type="button" class="btn btn-sm" style="margin-top:10px" onclick="browseDirectories()" data-i18n="browse_directories">浏览目录</button>
                            </div>

                            <!-- Directory Browser -->
                            <div class="form-group" id="directoryList" style="display:none">
                                <label data-i18n="subdirectories">子目录：</label>
                                <div id="directoryItems" class="dir-browser"></div>
                            </div>

                            <!-- Scan Levels -->
                            <div class="form-group">
                                <label data-i18n="scan_levels_label">扫描层级：</label>
                                <div class="checkbox-group" id="scanLevels">
                                    <label><input type="checkbox" name="scanLevel" value="1" checked> <span data-i18n="scan_level_1">第1层</span></label>
                                    <label><input type="checkbox" name="scanLevel" value="2"> <span data-i18n="scan_level_2">第2层</span></label>
                                    <label><input type="checkbox" name="scanLevel" value="3"> <span data-i18n="scan_level_3">第3层</span></label>
                                    <label><input type="checkbox" name="scanLevel" value="4"> <span data-i18n="scan_level_4">第4层</span></label>
                                </div>
                                <div class="hint-box" data-i18n="scan_levels_hint">勾选的层级仅扫描该层目录下的文件，不会自动扫描子文件夹；如需导入子文件夹内的游戏，请勾选对应的更深层级。（第1层即你填写的扫描根路径本身）</div>
                            </div>

                            <!-- Scraper System Combobox -->
                            <div class="form-group">
                                <label for="scraperSystemSearch" data-i18n="select_system_label">选择系统（可选）：</label>
                                <div class="combobox" id="systemCombobox">
                                    <input type="text" id="scraperSystemSearch" autocomplete="off" data-i18n-placeholder="system_search_placeholder" placeholder="输入关键词搜索系统…">
                                    <input type="hidden" id="scraperSystem" name="scraperSystem" value="">
                                    <div class="combobox-list" id="scraperSystemList"></div>
                                </div>
                            </div>

                            <!-- Import Method -->
                            <div class="form-group">
                                <label for="importMethod" data-i18n="import_method_label">导入方式：</label>
                                <select id="importMethod" name="importMethod" onchange="toggleTemplateOptions(); onSystemSelect()" required>
                                    <option value="template" selected data-i18n="import_method_template">模板方式</option>
                                    <option value="noDataFile" data-i18n="import_method_no_data_file">无数据文件导入</option>
                                </select>
                            </div>

                            <!-- No Data File Warning -->
                            <div class="form-group" id="noDataFileWarning" style="display:none">
                                <div class="warning-box">
                                    <div class="warning-box-title" data-i18n="no_data_file_warning_title"></div>
                                    <div class="warning-box-content">
                                        <div data-i18n="no_data_file_warning_1"></div>
                                        <div data-i18n="no_data_file_warning_2"></div>
                                        <div data-i18n="no_data_file_warning_3"></div>
                                        <div style="margin-left:20px;color:var(--text-tertiary)">
                                            <div data-i18n="no_data_file_warning_example"></div>
                                            <div>&nbsp;&nbsp;"media/{gameName}/wheel.{ext}" <span data-i18n="no_data_file_warning_example_text"></span></div>
                                            <div data-i18n="no_data_file_warning_other"></div>
                                        </div>
                                        <div class="danger-text" data-i18n="no_data_file_warning_4"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- File Extensions -->
                            <div class="form-group" id="fileExtensionsGroup" style="display:none">
                                <label for="fileExtensions" data-i18n="file_extensions_label">文件扩展名（逗号分隔）：</label>
                                <input type="text" id="fileExtensions" name="fileExtensions" value=".nes,.snes,.gba,.zip,.7z" placeholder=".nes,.snes,.gba,.zip,.7z">
                            </div>

                            <!-- Template Options -->
                            <div class="form-group" id="templateOptions" style="display:none">
                                <label for="importTemplate" data-i18n="import_template_label">导入模板：</label>
                                <select id="importTemplate" name="importTemplate" onchange="updateTemplateDescription()">
                                    <option value="" data-i18n="loading_templates">加载模板中...</option>
                                </select>
                                <div id="templateDescription" class="template-desc"></div>
                            </div>

                            <!-- Media Discovery -->
                            <div class="form-group" id="mediaDiscoveryGroup" style="display:none">
                                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:400;margin-bottom:0">
                                    <input type="checkbox" id="enableMediaDiscovery" name="enableMediaDiscovery" checked style="width:16px;height:16px;accent-color:var(--accent-primary)">
                                    <span data-i18n="enable_media_discovery">匹配无记录媒体文件（按模板规则扫描磁盘）</span>
                                </label>
                                <div class="hint-box">
                                    <span data-i18n="enable_media_discovery_hint">勾选：完全按模板执行，包括 mediaDiscovery 规则扫描。不勾选：仅处理数据文件中已声明的媒体路径，跳过 mediaDiscovery。</span>
                                </div>
                            </div>

                            <!-- Thread Count -->
                            <div class="form-group">
                                <label for="threadCount" data-i18n="thread_count_label">导入线程数：</label>
                                <select id="threadCount" name="threadCount" required>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4" selected data-i18n="thread_count_default">4（默认）</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>

                            <!-- Submit -->
                            <div class="button-group">
                                <button type="submit" class="btn" id="submitBtn">
                                    <span id="loadingSpinner" class="loading-spinner" style="display:none"></span>
                                    <span id="btnText" data-i18n="start_scan">开始扫描并导入</span>
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Footer -->
                    <div class="page-footer">
                        <p data-i18n="copyright">© 2024 Frontend-Killer | 模拟游戏元数据管理平台</p>
                        <p class="version">v1.2</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Notification Modal (shared) -->
    <div th:replace="~{fragments/layout :: notification-modal}"></div>

    <!-- Common Scripts -->
    <div th:replace="~{fragments/layout :: common-scripts}"></div>

    <!-- Page Scripts -->
    <script th:inline="javascript">
    (function() {
        'use strict';

        // ========== State ==========
        let templates = [];
        let scraperSystems = [];
        let systemComboboxInited = false;
        let systemActiveIndex = -1;
        let systemFiltered = [];

        // ========== Helpers ==========
        function getI18nText(key, fallback) {
            return I18n.t(key, fallback || key);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotification(message, type) {
            type = type || 'info';
            const el = document.createElement('div');
            el.className = 'notification-toast ' + type;
            el.textContent = message;
            document.body.appendChild(el);
            setTimeout(function() {
                el.style.animation = 'slideOutRight 0.3s ease-in forwards';
                setTimeout(function() { el.remove(); }, 300);
            }, 3000);
        }

        // ========== Templates ==========
        function loadTemplates() {
            var sel = document.getElementById('importTemplate');
            var prevValue = sel.value;   // 保留当前选择，避免重载/bfcache 后下拉与说明区不一致
            sel.innerHTML = '<option value="">' + getI18nText('loading_templates', '加载模板中...') + '</option>';
            fetch('/api/gamelist/import/templates')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    templates = data || [];
                    sel.innerHTML = '';
                    var method = document.getElementById('importMethod').value;
                    if (method === 'noDataFile') {
                        var opt = document.createElement('option');
                        opt.value = '';
                        opt.textContent = getI18nText('no_template', '无模板');
                        opt.selected = true;
                        sel.appendChild(opt);
                    }
                    if (templates.length > 0) {
                        templates.forEach(function(t) {
                            var o = document.createElement('option');
                            o.value = t.fileName;
                            o.textContent = t.name || t.fileName;
                            sel.appendChild(o);
                        });
                    } else {
                        var o = document.createElement('option');
                        o.value = '';
                        o.textContent = getI18nText('no_templates_available', '暂无可用模板');
                        sel.appendChild(o);
                    }
                    // 若之前选中的模板仍存在，恢复选中（下拉与说明区保持一致）
                    if (prevValue && templates.some(function(t) { return t.fileName === prevValue; })) {
                        sel.value = prevValue;
                    }
                    updateTemplateDescription();
                })
                .catch(function() {
                    sel.innerHTML = '<option value="">' + getI18nText('error_loading_templates', '加载模板失败') + '</option>';
                });
        }

        function updateTemplateDescription() {
            var sel = document.getElementById('importTemplate');
            var desc = document.getElementById('templateDescription');
            if (!desc) return;
            var t = templates.find(function(x) { return x.fileName === sel.value; });
            if (!t) {
                desc.textContent = getI18nText('no_template_description', '暂无模板描述');
                return;
            }
            // 标题行用模板全名（description，每个模板唯一），详情行用介绍（notes）；
            // 二者用换行拼接，配合 .template-desc 的 white-space: pre-line 渲染，确保切换模板时说明必然变化
            var parts = [];
            if (t.description) { parts.push(t.description); }
            if (t.notes) { parts.push(t.notes); }
            desc.textContent = parts.length ? parts.join('\n') : getI18nText('no_template_description', '暂无模板描述');
        }

        function toggleTemplateOptions() {
            var method = document.getElementById('importMethod').value;
            document.getElementById('templateOptions').style.display = 'block';
            document.getElementById('mediaDiscoveryGroup').style.display = method === 'template' ? 'block' : 'none';
            document.getElementById('noDataFileWarning').style.display = method === 'noDataFile' ? 'block' : 'none';
            document.getElementById('fileExtensionsGroup').style.display = method === 'noDataFile' ? 'block' : 'none';
            loadTemplates();
        }

        // ========== Scraper Systems Combobox ==========
        function loadScraperSystems() {
            fetch('/api/scraper-systems')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    scraperSystems = data.data || [];
                    initSystemCombobox();
                })
                .catch(function(e) { console.error('Error loading scraper systems:', e); });
        }

        function getSystemDisplayName(sys) {
            return sys.nomEu || sys.nameCn || sys.name || 'Unknown';
        }

        function initSystemCombobox() {
            var input = document.getElementById('scraperSystemSearch');
            var list = document.getElementById('scraperSystemList');
            if (!input || !list) return;
            input.placeholder = getI18nText('system_search_placeholder', '输入关键词搜索系统…');
            if (systemComboboxInited) {
                if (list.classList.contains('open')) renderSystemList(input.value);
                return;
            }
            systemComboboxInited = true;

            input.addEventListener('input', function() {
                document.getElementById('scraperSystem').value = '';
                openSystemList();
                renderSystemList(input.value);
            });
            input.addEventListener('focus', function() { openSystemList(); renderSystemList(input.value); });
            input.addEventListener('click', function() { openSystemList(); renderSystemList(input.value); });
            input.addEventListener('keydown', function(e) {
                if (!list.classList.contains('open')) {
                    if (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); openSystemList(); renderSystemList(input.value); }
                    return;
                }
                if (e.key === 'ArrowDown') { e.preventDefault(); moveSystemActive(1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); moveSystemActive(-1); }
                else if (e.key === 'Enter') { e.preventDefault(); if (systemActiveIndex >= 0 && systemActiveIndex < systemFiltered.length) chooseSystemItem(systemActiveIndex); }
                else if (e.key === 'Escape') { closeSystemList(); }
            });
            document.addEventListener('click', function(e) {
                var box = document.getElementById('systemCombobox');
                if (box && !box.contains(e.target)) closeSystemList();
            });
        }

        function openSystemList() { document.getElementById('scraperSystemList').classList.add('open'); }
        function closeSystemList() { document.getElementById('scraperSystemList').classList.remove('open'); systemActiveIndex = -1; }

        function renderSystemList(keyword) {
            var list = document.getElementById('scraperSystemList');
            var hidden = document.getElementById('scraperSystem');
            var kw = (keyword || '').trim().toLowerCase();
            var items = [];
            var noSelText = getI18nText('no_system_selected', '不选择系统');
            if (!kw || noSelText.toLowerCase().includes(kw)) items.push({ id: '', text: noSelText });
            (scraperSystems || []).forEach(function(sys) {
                var text = getSystemDisplayName(sys);
                var hay = [sys.nomEu, sys.nameCn, sys.name, text].filter(Boolean).join(' ').toLowerCase();
                if (!kw || hay.includes(kw)) items.push({ id: String(sys.id), text: text });
            });
            systemFiltered = items;
            systemActiveIndex = -1;
            list.innerHTML = '';
            if (items.length === 0) {
                var empty = document.createElement('div');
                empty.className = 'combobox-empty';
                empty.textContent = getI18nText('system_no_match', '无匹配系统');
                list.appendChild(empty);
                return;
            }
            items.forEach(function(item, index) {
                var div = document.createElement('div');
                div.className = 'combobox-item';
                div.textContent = item.text;
                div.setAttribute('data-index', index);
                if (item.id !== '' && String(hidden.value) === item.id) div.classList.add('selected');
                div.addEventListener('mousedown', function(e) { e.preventDefault(); chooseSystemItem(index); });
                div.addEventListener('mouseenter', function() { systemActiveIndex = index; updateSystemActiveStyle(); });
                list.appendChild(div);
            });
        }

        function moveSystemActive(delta) {
            if (systemFiltered.length === 0) return;
            systemActiveIndex += delta;
            if (systemActiveIndex < 0) systemActiveIndex = systemFiltered.length - 1;
            if (systemActiveIndex >= systemFiltered.length) systemActiveIndex = 0;
            updateSystemActiveStyle();
            var activeEl = document.getElementById('scraperSystemList').querySelector('.combobox-item.active');
            if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
        }

        function updateSystemActiveStyle() {
            document.getElementById('scraperSystemList').querySelectorAll('.combobox-item').forEach(function(el) {
                var idx = parseInt(el.getAttribute('data-index'), 10);
                el.classList.toggle('active', idx === systemActiveIndex);
            });
        }

        function chooseSystemItem(index) {
            var item = systemFiltered[index];
            if (!item) return;
            var hidden = document.getElementById('scraperSystem');
            var input = document.getElementById('scraperSystemSearch');
            hidden.value = item.id;
            input.value = item.id === '' ? '' : item.text;
            closeSystemList();
            onSystemSelect();
            if (item.id !== '' && hidden.value === '') input.value = '';
        }

        function parseExtensions(str) {
            if (!str) return [];
            var exts = [];
            str.split(',').forEach(function(part) {
                part = part.trim();
                var m = part.match(/^([^(]+)\(([^)]+)\)$/);
                if (m) {
                    m[2].split('|').forEach(function(e) { e = e.trim(); if (e) exts.push('.' + e); });
                } else if (part) {
                    exts.push('.' + part);
                }
            });
            return exts;
        }

        function onSystemSelect() {
            var systemId = document.getElementById('scraperSystem').value;
            var importMethod = document.getElementById('importMethod').value;
            if (!systemId) return;
            var sys = scraperSystems.find(function(s) { return String(s.id) === String(systemId); });
            if (!sys) return;
            if (sys.romType === 'dossier') {
                showNotification(getI18nText('dossier_not_supported', '暂时不支持 dossier 类型的系统，请选择其他系统'), 'error');
                document.getElementById('scraperSystem').value = '';
                return;
            }
            if (importMethod === 'noDataFile') {
                var exts = parseExtensions(sys.extensions);
                if (sys.romType === 'rom' || sys.romType === 'fichier') {
                    if (exts.indexOf('.zip') === -1) exts.push('.zip');
                }
                if (exts.length > 0) document.getElementById('fileExtensions').value = exts.join(',');
            }
        }

        // ========== Directory Browser ==========
        window.browseDirectories = function browseDirectories() {
            var path = document.getElementById('path').value;
            var dirItems = document.getElementById('directoryItems');
            var dirList = document.getElementById('directoryList');
            dirItems.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-tertiary)">' + getI18nText('dash_loading', '加载中...') + '</div>';
            dirList.style.display = 'block';
            fetch('/api/scan/browse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: path })
            })
            .then(function(r) { return r.json(); })
            .then(function(result) {
                if (result.success) {
                    dirItems.innerHTML = '';
                    // Parent dir
                    if (path && path !== '/' && !/^[A-Za-z]:\\?$/.test(path)) {
                        var parentEl = document.createElement('div');
                        parentEl.className = 'dir-item parent-dir';
                        parentEl.innerHTML = '<span class="dir-icon">📁</span> .. (' + getI18nText('back_to_parent_directory', '返回上级') + ')';
                        parentEl.addEventListener('click', function() {
                            var parts = path.split(/[\\/]/).filter(Boolean);
                            parts.pop();
                            var parentPath = '';
                            if (parts.length > 0) {
                                parentPath = path.startsWith('/') ? '/' + parts.join('/') : (path.match(/^[A-Za-z]:/) ? parts[0] + (parts.length > 1 ? '/' : '') + parts.slice(1).join('/') : parts.join('/'));
                            } else {
                                parentPath = path.startsWith('/') ? '/' : (path.match(/^[A-Za-z]:/) ? path.split(/[\\/]/)[0] + '\\' : '');
                            }
                            document.getElementById('path').value = parentPath;
                            browseDirectories();
                        });
                        dirItems.appendChild(parentEl);
                    }
                    // Subdirs
                    if (result.directories && result.directories.length > 0) {
                        result.directories.forEach(function(dir) {
                            var el = document.createElement('div');
                            el.className = 'dir-item';
                            el.innerHTML = '<span class="dir-icon">📁</span> ' + escapeHtml(dir);
                            el.addEventListener('click', function() { document.getElementById('path').value = dir; browseDirectories(); });
                            dirItems.appendChild(el);
                        });
                    } else {
                        dirItems.innerHTML = '<div class="dir-empty">' + getI18nText('no_subdirectories', '该目录下没有子目录') + '</div>';
                    }
                } else {
                    dirItems.innerHTML = '<div class="dir-error">' + escapeHtml(result.message || getI18nText('browse_failed', '无法浏览目录')) + '</div>';
                }
            })
            .catch(function(e) {
                dirItems.innerHTML = '<div class="dir-error">' + getI18nText('browse_error_prefix', '浏览目录失败: ') + escapeHtml(e.message) + '</div>';
            });
        }

        // ========== Form Submit ==========
        document.getElementById('scanForm').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') e.preventDefault();
        });

        document.getElementById('scanForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var path = document.getElementById('path').value;
            var levels = Array.from(document.querySelectorAll('input[name="scanLevel"]:checked')).map(function(cb) { return parseInt(cb.value); });
            var threadCount = parseInt(document.getElementById('threadCount').value);
            var importMethod = document.getElementById('importMethod').value;
            var importTemplate = document.getElementById('importTemplate').value;
            var fileExtensions = document.getElementById('fileExtensions').value;
            var scraperSystemId = document.getElementById('scraperSystem').value;
            var enableMediaDiscovery = document.getElementById('enableMediaDiscovery').checked;
            var noDataFile = importMethod === 'noDataFile';
            var submitBtn = document.getElementById('submitBtn');
            var spinner = document.getElementById('loadingSpinner');
            var btnText = document.getElementById('btnText');

            if (levels.length === 0) {
                showNotification(getI18nText('scan_levels_required', '请至少勾选一个扫描层级'), 'error');
                return;
            }

            localStorage.setItem('gamePath', path);
            spinner.style.display = 'inline-block';
            btnText.textContent = getI18nText('scanning', '扫描中...');
            submitBtn.disabled = true;

            function finish() {
                spinner.style.display = 'none';
                btnText.textContent = getI18nText('start_scan', '开始扫描并导入');
                submitBtn.disabled = false;
            }

            if (noDataFile) {
                showNotification(getI18nText('start_nodata_import', '开始执行无数据文件导入任务...'), 'info');
                fetch('/api/scan/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: [], type: 'none', threadCount: threadCount, importMethod: importMethod, importTemplate: importTemplate, noDataFile: true, fileExtensions: fileExtensions, scanPath: path, scraperSystemId: scraperSystemId, enableMediaDiscovery: enableMediaDiscovery, levels: levels })
                })
                .then(function(resp) {
                    return resp.json().then(function(data) { return { ok: resp.ok, data: data }; });
                })
                .then(function(result) {
                    if (result.ok && result.data && result.data.id) {
                        showNotification(getI18nText('import_task_created', '导入任务已创建，正在后台执行'), 'success');
                        showNotification(getI18nText('task_id_prefix', '任务ID: ') + result.data.id, 'info');
                        showNotification(getI18nText('go_task_management', '请前往任务管理页面查看执行情况'), 'info');
                    } else {
                        showNotification(getI18nText('error_prefix', (result.data && result.data.message) || '创建导入任务失败'), 'error');
                    }
                })
                .catch(function(err) { showNotification(getI18nText('error_prefix', err.message), 'error'); })
                .finally(finish);
            } else {
                showNotification(getI18nText('start_scanning_files', '开始扫描文件...'), 'info');
                fetch('/api/scan/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: path, levels: levels, importMethod: importMethod, importTemplate: importTemplate, scraperSystemId: scraperSystemId, enableMediaDiscovery: enableMediaDiscovery })
                })
                .then(function(r) { return r.json(); })
                .then(function(scanResult) {
                    if (!scanResult.success) {
                        showNotification(getI18nText('error_prefix', scanResult.message || '扫描失败'), 'error');
                        return;
                    }
                    var dataFiles = (scanResult.details || []).filter(function(d) {
                        return d.type === 'gamelist.xml' || d.type === 'metadata.pegasus.txt' || d.type.endsWith('.lpl');
                    });
                    showNotification(getI18nText('found_files', String(dataFiles.length)), 'success');
                    if (dataFiles.length === 0) {
                        showNotification(getI18nText('no_data_files_found', '未找到数据文件'), 'info');
                        return;
                    }
                    showNotification(getI18nText('start_async_import', '开始执行异步导入任务...'), 'info');
                    return fetch('/api/scan/import', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ files: dataFiles.map(function(d) { return d.filePath; }), type: dataFiles[0].type, threadCount: threadCount, importMethod: importMethod, importTemplate: importTemplate, scanPath: path, scraperSystemId: scraperSystemId, enableMediaDiscovery: enableMediaDiscovery })
                    }).then(function(r) { return r.json(); });
                })
                .then(function(importResult) {
                    if (importResult) {
                        if (importResult.id) {
                            showNotification(getI18nText('import_task_created', '导入任务已创建，正在后台执行'), 'success');
                            showNotification(getI18nText('task_id_prefix', '任务ID: ') + importResult.id, 'info');
                            showNotification(getI18nText('go_task_management', '请前往任务管理页面查看执行情况'), 'info');
                        } else {
                            showNotification(getI18nText('error_prefix', importResult.message || '创建导入任务失败'), 'error');
                        }
                    }
                })
                .catch(function(err) { showNotification(getI18nText('error_prefix', err.message), 'error'); })
                .finally(finish);
            }
        });

        // ========== Init ==========
        document.addEventListener('DOMContentLoaded', function() {
            var gamePath = localStorage.getItem('gamePath');
            document.getElementById('path').value = gamePath || '/roms';
            loadScraperSystems();
            toggleTemplateOptions();
            browseDirectories();
        });

        // bfcache 恢复页面时，浏览器还原下拉选中值不会触发 change，这里主动同步一次说明区
        window.addEventListener('pageshow', function() {
            updateTemplateDescription();
        });

        // 本页脚本包裹在 IIFE 内，而 HTML 内联 onchange/onclick 处理器在全局作用域查找函数，
        // 因此需将这些被内联 handler 引用的函数显式暴露到 window（与 browseDirectories 一致）
        window.toggleTemplateOptions = toggleTemplateOptions;
        window.onSystemSelect = onSystemSelect;
        window.updateTemplateDescription = updateTemplateDescription;
    })();
    </script>
</body>
</html>
