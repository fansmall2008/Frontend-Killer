<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ====== Sidebar Fragment ====== -->
<div th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-brand">
        <div class="logo">FK</div>
        <div>
            <h1>FRONTEND<br>-KILLER</h1>
            <span class="brand-sub">v1.2 · METADATA MGR</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-section-label">▸ OVERVIEW</div>
        <a class="nav-item" th:classappend="${activePage == 'home'} ? 'active'" href="/">
            <span class="icon">🏠</span> <span data-i18n="nav_home">首页</span>
        </a>

        <div class="nav-section-label">▸ DATA</div>
        <a class="nav-item" th:classappend="${activePage == 'import'} ? 'active'" th:href="@{/data-import}">
            <span class="icon">📥</span> <span data-i18n="nav_import">数据导入</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'export'} ? 'active'" th:href="@{/export}">
            <span class="icon">📤</span> <span data-i18n="nav_export">数据导出</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'platform'} ? 'active'" th:href="@{/platform-management}">
            <span class="icon">🎮</span> <span data-i18n="nav_platform">平台管理</span>
            <span class="badge-count" id="sidebarPlatformCount" style="display:none">-</span>
        </a>

        <div class="nav-section-label">▸ TOOLS</div>
        <a class="nav-item" th:classappend="${activePage == 'scraper'} ? 'active'" th:href="@{/scraper-system-list}">
            <span class="icon">🔍</span> <span data-i18n="nav_scraper">刮削系统</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'media'} ? 'active'" th:href="@{/media-download}">
            <span class="icon">🖼️</span> <span data-i18n="nav_media">媒体下载</span>
            <span class="badge-count" id="sidebarMediaCount" style="display:none">-</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'merge'} ? 'active'" th:href="@{/platform-merge}">
            <span class="icon">🔀</span> <span data-i18n="nav_merge">数据合并</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'tasks'} ? 'active'" th:href="@{/task-management}">
            <span class="icon">📋</span> <span data-i18n="nav_tasks">任务管理</span>
        </a>
        <a class="nav-item" th:classappend="${activePage == 'logs'} ? 'active'" th:href="@{/log-viewer}">
            <span class="icon">📊</span> <span data-i18n="nav_logs">日志查看</span>
        </a>

        <div class="nav-section-label">▸ SYSTEM</div>
        <a class="nav-item" th:classappend="${activePage == 'settings'} ? 'active'" th:href="@{/system-settings}">
            <span class="icon">⚙️</span> <span data-i18n="nav_settings">系统设置</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="status-dot"></div>
        <span id="sidebarStatus">INITIALIZING...</span>
    </div>
</div>

<!-- ====== Header Fragment ====== -->
<header th:fragment="header(pageTitle)" class="top-header">
    <div class="breadcrumb">
        <a href="/">🏠</a>
        <span class="sep">›</span>
        <span class="current" th:text="${pageTitle}">首页</span>
    </div>
    <div class="header-actions">
        <button class="header-icon-btn" onclick="toggleTheme()" title="Toggle Theme">
            <span id="themeIcon">☀️</span>
        </button>
        <button class="header-icon-btn" id="headerNotifBtn" onclick="openNotificationPanel()">
            🔔
            <span class="notif-badge" id="headerNotifBadge" style="display:none">0</span>
        </button>
    </div>
</header>

<!-- ====== Notification Modal Fragment ====== -->
<div th:fragment="notification-modal" id="notificationModal" class="modal" style="display:none">
    <div class="modal-content">
        <span class="close" onclick="closeNotificationPanel()">&times;</span>
        <h2 class="modal-title" data-i18n="task_messages">任务消息</h2>
        <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
            <button type="button" class="btn notif-clear-btn" onclick="clearNotifications()" data-i18n="notif_clear">清空</button>
        </div>
        <div id="notificationContent" style="max-height:400px;overflow-y:auto"></div>
    </div>
</div>

<!-- ====== Common Scripts Fragment ====== -->
<th:block th:fragment="common-scripts">
    <script>
        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        // Restore saved theme
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
                const icon = document.getElementById('themeIcon');
                if (icon) icon.textContent = saved === 'dark' ? '☀️' : '🌙';
            }
        })();

        // Update sidebar counts
        (function() {
            // Platform count
            fetch('/api/gamelist/statistics/overall')
                .then(r => r.json())
                .then(stats => {
                    const el = document.getElementById('sidebarPlatformCount');
                    if (el && stats.totalPlatforms) {
                        el.textContent = stats.totalPlatforms;
                        el.style.display = '';
                    }
                    // Update sidebar status
                    const statusEl = document.getElementById('sidebarStatus');
                    if (statusEl) {
                        statusEl.textContent = 'GAMES: ' + (stats.totalGames || 0).toLocaleString();
                    }
                })
                .catch(() => {});

            // Media download count
            fetch('/api/media-download/status')
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('sidebarMediaCount');
                    const pending = data.pendingCount || data.totalPending || 0;
                    if (el && pending > 0) {
                        el.textContent = pending;
                        el.style.display = '';
                    }
                })
                .catch(() => {});
        })();

        // Notification modal: click overlay to close
        (function() {
            const modal = document.getElementById('notificationModal');
            if (modal) {
                modal.addEventListener('click', function(event) {
                    if (event.target === modal) {
                        modal.style.display = 'none';
                        window.notifPanelOpen = false;
                    }
                });
            }
        })();

        // ====== 通知中心（全局）：SSE 订阅 + 铃铛角标 + 面板渲染 ======
        (function() {
            function i18n(key, fallback) {
                return (typeof getI18nText === 'function') ? getI18nText(key, fallback) : fallback;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            function formatTime(value) {
                if (!value) return '';
                const d = new Date(value);
                if (isNaN(d.getTime())) return String(value);
                const p = function(n) { return String(n).padStart(2, '0'); };
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' '
                    + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
            }

            window.refreshNotificationBadge = function() {
                fetch('/api/notifications/unread-count')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        const badge = document.getElementById('headerNotifBadge');
                        if (!badge) return;
                        const count = data.count || 0;
                        badge.textContent = count > 99 ? '99+' : count;
                        badge.style.display = count > 0 ? 'flex' : 'none';
                    })
                    .catch(function() {});
            };

            window.renderNotificationList = function() {
                const content = document.getElementById('notificationContent');
                if (!content) return;
                fetch('/api/notifications?limit=100')
                    .then(function(r) { return r.json(); })
                    .then(function(list) {
                        content.innerHTML = '';
                        if (!list || list.length === 0) {
                            content.innerHTML = '<p class="notif-empty">' + escapeHtml(i18n('notif_empty', '暂无通知')) + '</p>';
                            return;
                        }
                        list.forEach(function(n) {
                            const item = document.createElement('div');
                            item.className = 'notification-item notif-' + (n.type || 'info') + (n.read ? ' read' : ' unread');
                            const msg = n.message ? '<div class="notif-message">' + escapeHtml(n.message) + '</div>' : '';
                            item.innerHTML =
                                '<div class="notif-title">' + escapeHtml(n.title) + '</div>' + msg +
                                '<div class="notif-time">' + escapeHtml(formatTime(n.createdAt)) + '</div>';
                            content.appendChild(item);
                        });
                    })
                    .catch(function() {});
            };

            window.openNotificationPanel = function() {
                const modal = document.getElementById('notificationModal');
                if (!modal) return;
                modal.style.display = 'block';
                window.notifPanelOpen = true;
                renderNotificationList();
                // 打开即视为已读：清除角标
                fetch('/api/notifications/read', { method: 'PUT' })
                    .then(function() { refreshNotificationBadge(); })
                    .catch(function() {});
            };

            window.closeNotificationPanel = function() {
                const modal = document.getElementById('notificationModal');
                if (modal) modal.style.display = 'none';
                window.notifPanelOpen = false;
            };

            window.clearNotifications = function() {
                if (!confirm(i18n('notif_clear_confirm', '确定清空所有通知吗？'))) return;
                fetch('/api/notifications', { method: 'DELETE' })
                    .then(function() {
                        renderNotificationList();
                        refreshNotificationBadge();
                    })
                    .catch(function() {});
            };

            // SSE 订阅：新通知到达时实时刷新角标与面板
            // 同一个浏览器选项卡在 HTTP/1.1 下最多 6 个并发连接，SSE 会长期占用 1 个；
            // 而 EventSource 默认断开后自动重连（3s），页面导航时如果没显式 close，
            // 旧连接可能拖到下一个页面建立，新页面 fetch 会排在后面导致“转圈”。
            // 因此将 source 挂到 window 上，并在 pagehide/beforeunload 时主动 close。
            function connectSse() {
                if (typeof EventSource === 'undefined') return;
                try {
                    const source = new EventSource('/api/notifications/stream');
                    window.__notifEventSource = source;
                    source.addEventListener('notification', function() {
                        refreshNotificationBadge();
                        if (window.notifPanelOpen) renderNotificationList();
                    });
                    source.addEventListener('error', function() {
                        // 服务端主动关闭或网络异常时不再自动重连，避免卡片卡住时反复握手
                        if (source.readyState === EventSource.CLOSED) {
                            try { source.close(); } catch (e) {}
                        }
                    });
                    const shutdown = function() {
                        try { source.close(); } catch (e) {}
                        window.__notifEventSource = null;
                    };
                    window.addEventListener('pagehide', shutdown);
                    window.addEventListener('beforeunload', shutdown);
                } catch (e) { /* 不支持 SSE 时由轮询兑底 */ }
                // 兑底轮询：防止 SSE 断线期间错过角标更新
                setInterval(refreshNotificationBadge, 30000);
            }

            document.addEventListener('DOMContentLoaded', function() {
                refreshNotificationBadge();
                connectSse();
            });
        })();
    </script>
</th:block>

</html>
