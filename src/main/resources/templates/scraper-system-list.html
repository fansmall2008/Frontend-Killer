<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="scraper_system_list_title">刮削系统管理 - 前端杀手</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/scraper-system-list.css}">
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/layout :: sidebar('scraper')}"></div>
        <div class="main-area">
            <div th:replace="~{fragments/layout :: header('SCRAPER_SYSTEM_LIST')}"></div>
            <main class="content">

    <div class="pg-container">
        <div class="toolbar">
            <h2 data-i18n="scraper_system_list_title">刮削系统管理</h2>
            <div class="toolbar-buttons">
                <button class="btn btn-primary" onclick="addSystem()">
                    <span data-i18n="btn_add_system">添加系统</span>
                </button>
                <button class="btn btn-success" onclick="initSystems()">
                    <span data-i18n="btn_init_systems">初始化系统</span>
                </button>
                <button class="btn btn-danger" onclick="confirmClear()">
                    <span data-i18n="btn_clear_all">清空全部</span>
                </button>
            </div>
        </div>

        <div id="status-message" class="status-message"></div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th data-i18n="col_id">ID</th>
                        <th data-i18n="col_system_id">系统ID</th>
                        <th data-i18n="col_name">名称</th>
                        <th data-i18n="col_name_en">英文名称</th>
                        <th data-i18n="col_company">制造商</th>
                        <th data-i18n="col_type">类型</th>
                        <th data-i18n="col_release_year">发行年份</th>
                        <th data-i18n="col_media_status">媒体状态</th>
                        <th data-i18n="col_actions">操作</th>
                    </tr>
                </thead>
                <tbody id="systems-table-body">
                </tbody>
            </table>
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <h3 data-i18n="empty_no_systems">暂无刮削系统数据</h3>
            <p data-i18n="empty_tip">点击"初始化系统"按钮从 ScreenScraper 获取系统列表，或手动添加系统。</p>
        </div>

        <div class="pagination" id="pagination">
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="modal_delete_title">确认删除</h2>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p class="delete-warning" data-i18n="modal_delete_warning">确定要删除这个刮削系统吗？此操作无法撤销。</p>
                <p><span data-i18n="modal_delete_name">系统名称:</span> <span id="delete-system-name"></span></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDeleteModal()" data-i18n="btn_cancel">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()" data-i18n="btn_confirm_delete">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 清空确认弹窗 -->
    <div class="modal-overlay" id="clear-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="modal_clear_title">确认清空</h2>
                <button class="modal-close" onclick="closeClearModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p class="delete-warning" data-i18n="modal_clear_warning">确定要清空所有刮削系统数据吗？此操作无法撤销！</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeClearModal()" data-i18n="btn_cancel">取消</button>
                <button class="btn btn-danger" onclick="confirmClearAll()" data-i18n="btn_confirm_clear">确认清空</button>
            </div>
        </div>
    </div>

    <!-- 刮削模态框 -->
    <div id="scrapeModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="scrape_confirm">刮削确认</h2>
                <button class="modal-close" onclick="closeScrapeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="scrapeForm">
                    <input type="hidden" id="scrapeSystemId">
                    
                    <div class="form-group">
                        <p id="scrapeConfirmText" class="modal-text" data-i18n="scrape_confirm_text">
                            确认要刮削该系统的所有媒体文件吗？
                        </p>
                        <p class="modal-hint" data-i18n="scrape_auto_download_desc">
                            系统将自动获取所有可用的媒体文件并下载，包括不同地区的各种媒体类型。
                        </p>
                    </div>
                    
                    <div class="form-group">
                        <label for="scrapeRegion" data-i18n="scrape_region_label">刮削区域：</label>
                        <select id="scrapeRegion">
                            <option value="wor" data-i18n="region_wor">世界 (wor)</option>
                            <option value="us" data-i18n="region_us">美版 (us)</option>
                            <option value="eu" data-i18n="region_eu">欧版 (eu)</option>
                            <option value="jp" data-i18n="region_jp">日版 (jp)</option>
                            <option value="" data-i18n="region_all">全部区域</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeScrapeModal()" data-i18n="btn_cancel">取消</button>
                <button class="btn btn-primary" onclick="submitScrape()" data-i18n="btn_start_scrape">开始刮削</button>
            </div>
        </div>
    </div>

    <script>
        let systems = [];
        let deleteId = null;
        let currentPage = 1;
        const pageSize = 20;

        function loadSystems() {
            fetch('/api/scraper-systems')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        systems = data.data;
                        renderTable();
                    } else {
                        showStatus(data.message, 'error');
                    }
                })
                .catch(error => {
                    showStatus('加载系统列表失败: ' + error.message, 'error');
                });
        }

        function renderTable() {
            const tbody = document.getElementById('systems-table-body');
            const emptyState = document.getElementById('empty-state');
            const pagination = document.getElementById('pagination');

            if (systems.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                pagination.innerHTML = '';
                return;
            }

            emptyState.style.display = 'none';

            const totalPages = Math.ceil(systems.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageSystems = systems.slice(start, end);

            tbody.innerHTML = pageSystems.map(system => `
                <tr>
                    <td>${system.id}</td>
                    <td>${system.systemId}</td>
                    <td>
                        <div class="system-name">${escapeHtml(system.name)}</div>
                        ${system.nameCn ? '<div class="system-name-en">' + escapeHtml(system.nameCn) + '</div>' : ''}
                    </td>
                    <td>${escapeHtml(system.nameEn || '-')}</td>
                    <td>${escapeHtml(system.company || '-')}</td>
                    <td>${escapeHtml(system.type || '-')}</td>
                    <td>${system.releaseYear || '-'}</td>
                    <td>
                        ${system.mediaScraped ? 
                            '<span class="media-badge scraped" data-i18n="media_scraped">已刮削</span>' : 
                            '<span class="media-badge not-scraped" data-i18n="media_not_scraped">未刮削</span>'}
                    </td>
                    <td>
                        <button class="btn btn-primary btn-small" onclick="editSystem(${system.id})" data-i18n="btn_edit">编辑</button>
                        <button class="btn btn-success btn-small" onclick="openScrapeModal(${system.systemId}, '${escapeHtml(system.name)}')" data-i18n="btn_scrape">刮削</button>
                        <button class="btn btn-danger btn-small" onclick="openDeleteModal(${system.id}, '${escapeHtml(system.name)}')" data-i18n="btn_delete">删除</button>
                    </td>
                </tr>
            `).join('');

            pagination.innerHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>&lt;</button>
                <span>${currentPage} / ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>&gt;</button>
            `;
        }

        function changePage(page) {
            if (page < 1 || page > Math.ceil(systems.length / pageSize)) return;
            currentPage = page;
            renderTable();
        }

        function addSystem() {
            window.location.href = '/scraper-system-edit';
        }

        function editSystem(id) {
            window.location.href = '/scraper-system-edit?id=' + id;
        }

        function openDeleteModal(id, name) {
            deleteId = id;
            document.getElementById('delete-system-name').textContent = name;
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('active');
            deleteId = null;
        }

        function confirmDelete() {
            if (!deleteId) return;

            fetch(`/api/scraper-systems/${deleteId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(data.message, 'success');
                    loadSystems();
                } else {
                    showStatus(data.message, 'error');
                }
                closeDeleteModal();
            })
            .catch(error => {
                showStatus('删除失败: ' + error.message, 'error');
                closeDeleteModal();
            });
        }

        function confirmClear() {
            document.getElementById('clear-modal').classList.add('active');
        }

        function closeClearModal() {
            document.getElementById('clear-modal').classList.remove('active');
        }

        function confirmClearAll() {
            fetch('/api/scraper-systems/clear', {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(data.message, 'success');
                    loadSystems();
                } else {
                    showStatus(data.message, 'error');
                }
                closeClearModal();
            })
            .catch(error => {
                showStatus('清空失败: ' + error.message, 'error');
                closeClearModal();
            });
        }

        function initSystems() {
            // 先检查是否设置了用户凭证
            fetch('/api/screenscraper/status')
                .then(response => response.json())
                .then(statusData => {
                    const useGuestMode = !statusData.hasUserCredentials;
                    
                    if (useGuestMode) {
                        if (!confirm(I18n.t('init_guest_mode_confirm', '您尚未配置ScreenScraper用户名和密码，将使用游客模式初始化（每日请求限制约20000次）。是否继续？'))) {
                            return;
                        }
                    }
                    
                    showStatus(I18n.t('initializing_systems', '正在初始化刮削系统...'), 'success');
                    fetch('/api/screenscraper/init', {
                        method: 'POST'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showStatus(I18n.t('init_success_count', '初始化成功，已导入 {0} 个系统').replace('{0}', data.count), 'success');
                            loadSystems();
                        } else {
                            showStatus(data.message, 'error');
                        }
                    })
                    .catch(error => {
                        showStatus(I18n.t('init_failed_msg', '初始化失败: ') + error.message, 'error');
                    });
                })
                .catch(error => {
                    showStatus(I18n.t('cred_check_failed_msg', '获取凭据状态失败: ') + error.message, 'error');
                });
        }

        function checkUserCredentials() {
            fetch('/api/screenscraper/status')
                .then(response => response.json())
                .then(data => {
                    if (!data.hasUserCredentials) {
                        const statusDiv = document.getElementById('status-message');
                        statusDiv.innerHTML = I18n.t('cred_guest_mode_hint', '提示：您正在使用游客模式。如需更高请求限额，请在<a href="/system-settings" class="status-link">系统设置</a>中配置ScreenScraper账号。');
                        statusDiv.className = 'status-message status-error';
                        statusDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('检查凭证状态失败:', error);
                });
        }

        // 刮削功能
        let scrapeSystemId = null;
        let scrapeSystemName = null;

        function openScrapeModal(systemId, systemName) {
            scrapeSystemId = systemId;
            scrapeSystemName = systemName;

            document.getElementById('scrapeSystemId').value = systemId;
            const confirmText = typeof I18n !== 'undefined' && I18n.t
                ? I18n.t('scrape_confirm_with_name', '确认要刮削系统 "%s" 的所有媒体文件吗？').replace('%s', systemName)
                : '确认要刮削系统 "' + systemName + '" 的所有媒体文件吗？';
            document.getElementById('scrapeConfirmText').textContent = confirmText;
            document.getElementById('scrapeModal').style.display = 'flex';
        }

        function closeScrapeModal() {
            document.getElementById('scrapeModal').style.display = 'none';
            scrapeSystemId = null;
            scrapeSystemName = null;
        }

        function submitScrape() {
            if (!scrapeSystemId) {
                const msg = I18n.t('please_select_scrape_system', '请选择要刮削的系统');
                showStatus(msg, 'error');
                return;
            }

            const selectedRegion = document.getElementById('scrapeRegion').value;
            const data = {
                systemId: scrapeSystemId
            };
            if (selectedRegion) {
                data.region = selectedRegion;
            }

            closeScrapeModal();

            const regionText = selectedRegion ? selectedRegion.toUpperCase() : 'ALL';
            const scrapingMsg = I18n.t('scraping_system_name_region', '正在刮削系统') + ' ' + scrapeSystemName + ' (' + regionText + ')...';
            showStatus(scrapingMsg, 'success');

            fetch('/api/scraper-systems/scrape-all', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    const successMsg = I18n.t('scrape_task_started_msg', '刮削任务已启动！请前往任务管理页面查看进度');
                    showStatus(successMsg, 'success');
                } else {
                    const failedMsg = I18n.t('scrape_failed_msg', '刮削失败') + ': ' + (result.message || I18n.t('unknown_error', '未知错误'));
                    showStatus(failedMsg, 'error');
                }
            })
            .catch(error => {
                const errorMsg = I18n.t('scrape_failed_msg', '刮削失败') + ': ' + error.message;
                showStatus(errorMsg, 'error');
            });
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = message;
            statusDiv.className = 'status-message status-' + type;
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 5000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSystems();
            checkUserCredentials();
        });
    </script>
    

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: notification-modal}"></div>
    <div th:replace="~{fragments/layout :: common-scripts}"></div>
</body>
</html>
