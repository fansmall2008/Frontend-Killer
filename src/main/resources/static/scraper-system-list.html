<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="scraper_system_list_title">刮削系统管理 - 前端杀手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(50, 100, 200, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(200, 50, 100, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin: 60px 0 40px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            font-family: 'Arial Black', 'Impact', sans-serif;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 10px;
        }

        .header-buttons {
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ffff, #0088ff);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }

        .btn-success {
            background: linear-gradient(45deg, #00ff88, #00aa55);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff4444, #ff0000);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.8);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #666666, #444444);
            color: #fff;
            box-shadow: 0 0 15px rgba(102, 102, 102, 0.5);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(102, 102, 102, 0.8);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            margin-right: 5px;
        }

        .table-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .data-table th {
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 136, 255, 0.2));
            font-weight: bold;
            color: #00ffff;
        }

        .data-table tbody tr:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .system-name {
            font-weight: bold;
            color: #00ffff;
        }

        .system-name-en {
            color: #aaaaaa;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #888888;
        }

        .status-message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            display: block;
        }

        .status-error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            display: block;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 30px;
            min-width: 400px;
            max-width: 90%;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #00ffff;
            font-size: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.7;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #00ffff;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .delete-warning {
            color: #ff4444;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination button {
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 5px;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(0, 255, 255, 0.2);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            color: #00ffff;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00ffff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ff00ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <div class="header">
            <div class="header-content">
                <h1 data-i18n="scraper_system_list_title">刮削系统管理</h1>
                <p data-i18n="scraper_system_list_desc">管理 ScreenScraper 游戏系统数据</p>
                <div class="header-buttons">
                    <button class="btn btn-primary" onclick="addSystem()">
                        <span data-i18n="btn_add_system">添加系统</span>
                    </button>
                    <button class="btn btn-success" onclick="initSystems()">
                        <span data-i18n="btn_init_systems">初始化系统</span>
                    </button>
                    <button class="btn btn-danger" onclick="confirmClear()">
                        <span data-i18n="btn_clear_all">清空全部</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="status-message" class="status-message"></div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th data-i18n="col_id">ID</th>
                        <th data-i18n="col_system_id">系统ID</th>
                        <th data-i18n="col_name">名称</th>
                        <th data-i18n="col_name_en">英文名称</th>
                        <th data-i18n="col_company">制造商</th>
                        <th data-i18n="col_type">类型</th>
                        <th data-i18n="col_release_year">发行年份</th>
                        <th data-i18n="col_actions">操作</th>
                    </tr>
                </thead>
                <tbody id="systems-table-body">
                </tbody>
            </table>
        </div>

        <div class="empty-state" id="empty-state" style="display: none;">
            <h3 data-i18n="empty_no_systems">暂无刮削系统数据</h3>
            <p data-i18n="empty_tip">点击"初始化系统"按钮从 ScreenScraper 获取系统列表，或手动添加系统。</p>
        </div>

        <div class="pagination" id="pagination">
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="modal_delete_title">确认删除</h2>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p class="delete-warning" data-i18n="modal_delete_warning">确定要删除这个刮削系统吗？此操作无法撤销。</p>
                <p><span data-i18n="modal_delete_name">系统名称:</span> <span id="delete-system-name"></span></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDeleteModal()" data-i18n="btn_cancel">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()" data-i18n="btn_confirm_delete">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 清空确认弹窗 -->
    <div class="modal-overlay" id="clear-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="modal_clear_title">确认清空</h2>
                <button class="modal-close" onclick="closeClearModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p class="delete-warning" data-i18n="modal_clear_warning">确定要清空所有刮削系统数据吗？此操作无法撤销！</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeClearModal()" data-i18n="btn_cancel">取消</button>
                <button class="btn btn-danger" onclick="confirmClearAll()" data-i18n="btn_confirm_clear">确认清空</button>
            </div>
        </div>
    </div>

    <!-- 刮削模态框 -->
    <div id="scrapeModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 data-i18n="scrape_confirm">刮削确认</h2>
                <button class="modal-close" onclick="closeScrapeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="scrapeForm">
                    <input type="hidden" id="scrapeSystemId">
                    
                    <div class="form-group">
                        <p id="scrapeConfirmText" style="color: #ccc; font-size: 14px; line-height: 1.6;" data-i18n="scrape_confirm_text">
                            确认要刮削该系统的所有媒体文件吗？
                        </p>
                        <p style="color: #888; font-size: 12px; margin-top: 10px;" data-i18n="scrape_auto_download_desc">
                            系统将自动获取所有可用的媒体文件并下载，包括不同地区的各种媒体类型。
                        </p>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeScrapeModal()" data-i18n="btn_cancel">取消</button>
                <button class="btn" onclick="submitScrape()" data-i18n="btn_start_scrape">开始刮削</button>
            </div>
        </div>
    </div>

    <script>
        let systems = [];
        let deleteId = null;
        let currentPage = 1;
        const pageSize = 20;

        function loadSystems() {
            fetch('/api/scraper-systems')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        systems = data.data;
                        renderTable();
                    } else {
                        showStatus(data.message, 'error');
                    }
                })
                .catch(error => {
                    showStatus('加载系统列表失败: ' + error.message, 'error');
                });
        }

        function renderTable() {
            const tbody = document.getElementById('systems-table-body');
            const emptyState = document.getElementById('empty-state');
            const pagination = document.getElementById('pagination');

            if (systems.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                pagination.innerHTML = '';
                return;
            }

            emptyState.style.display = 'none';

            const totalPages = Math.ceil(systems.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageSystems = systems.slice(start, end);

            tbody.innerHTML = pageSystems.map(system => `
                <tr>
                    <td>${system.id}</td>
                    <td>${system.systemId}</td>
                    <td>
                        <div class="system-name">${escapeHtml(system.name)}</div>
                        ${system.nameCn ? '<div class="system-name-en">' + escapeHtml(system.nameCn) + '</div>' : ''}
                    </td>
                    <td>${escapeHtml(system.nameEn || '-')}</td>
                    <td>${escapeHtml(system.company || '-')}</td>
                    <td>${escapeHtml(system.type || '-')}</td>
                    <td>${system.releaseYear || '-'}</td>
                    <td>
                        <button class="btn btn-primary btn-small" onclick="editSystem(${system.id})" data-i18n="btn_edit">编辑</button>
                        <button class="btn btn-success btn-small" onclick="openScrapeModal(${system.systemId}, '${escapeHtml(system.name)}')" data-i18n="btn_scrape">刮削</button>
                        <button class="btn btn-danger btn-small" onclick="openDeleteModal(${system.id}, '${escapeHtml(system.name)}')" data-i18n="btn_delete">删除</button>
                    </td>
                </tr>
            `).join('');

            pagination.innerHTML = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>&lt;</button>
                <span>${currentPage} / ${totalPages}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>&gt;</button>
            `;
        }

        function changePage(page) {
            if (page < 1 || page > Math.ceil(systems.length / pageSize)) return;
            currentPage = page;
            renderTable();
        }

        function addSystem() {
            window.location.href = 'scraper-system-edit.html';
        }

        function editSystem(id) {
            window.location.href = 'scraper-system-edit.html?id=' + id;
        }

        function openDeleteModal(id, name) {
            deleteId = id;
            document.getElementById('delete-system-name').textContent = name;
            document.getElementById('delete-modal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('active');
            deleteId = null;
        }

        function confirmDelete() {
            if (!deleteId) return;

            fetch(`/api/scraper-systems/${deleteId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(data.message, 'success');
                    loadSystems();
                } else {
                    showStatus(data.message, 'error');
                }
                closeDeleteModal();
            })
            .catch(error => {
                showStatus('删除失败: ' + error.message, 'error');
                closeDeleteModal();
            });
        }

        function confirmClear() {
            document.getElementById('clear-modal').classList.add('active');
        }

        function closeClearModal() {
            document.getElementById('clear-modal').classList.remove('active');
        }

        function confirmClearAll() {
            fetch('/api/scraper-systems/clear', {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(data.message, 'success');
                    loadSystems();
                } else {
                    showStatus(data.message, 'error');
                }
                closeClearModal();
            })
            .catch(error => {
                showStatus('清空失败: ' + error.message, 'error');
                closeClearModal();
            });
        }

        function initSystems() {
            // 先检查是否设置了用户凭证
            fetch('/api/screenscraper/status')
                .then(response => response.json())
                .then(statusData => {
                    const useGuestMode = !statusData.hasUserCredentials;
                    
                    if (useGuestMode) {
                        if (!confirm('您尚未配置ScreenScraper用户名和密码，将使用游客模式初始化（每日请求限制约20000次）。是否继续？')) {
                            return;
                        }
                    }
                    
                    showStatus('正在初始化刮削系统...', 'success');
                    fetch('/api/screenscraper/init', {
                        method: 'POST'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showStatus('初始化成功！已导入 ' + data.count + ' 个系统', 'success');
                            loadSystems();
                        } else {
                            showStatus(data.message, 'error');
                        }
                    })
                    .catch(error => {
                        showStatus('初始化失败: ' + error.message, 'error');
                    });
                })
                .catch(error => {
                    showStatus('检查凭证状态失败: ' + error.message, 'error');
                });
        }

        function checkUserCredentials() {
            fetch('/api/screenscraper/status')
                .then(response => response.json())
                .then(data => {
                    if (!data.hasUserCredentials) {
                        const statusDiv = document.getElementById('status-message');
                        statusDiv.innerHTML = '提示：您正在使用游客模式。如需更高请求限额，请在<a href="system-settings.html" style="color: #00ffff;">系统设置</a>中配置ScreenScraper账号。';
                        statusDiv.className = 'status-message status-error';
                        statusDiv.style.display = 'block';
                    }
                })
                .catch(error => {
                    console.error('检查凭证状态失败:', error);
                });
        }

        // 刮削功能
        let scrapeSystemId = null;
        let scrapeSystemName = null;

        function openScrapeModal(systemId, systemName) {
            scrapeSystemId = systemId;
            scrapeSystemName = systemName;

            document.getElementById('scrapeSystemId').value = systemId;
            const confirmText = typeof I18n !== 'undefined' && I18n.t
                ? I18n.t('scrape_confirm_with_name', '确认要刮削系统 "%s" 的所有媒体文件吗？').replace('%s', systemName)
                : '确认要刮削系统 "' + systemName + '" 的所有媒体文件吗？';
            document.getElementById('scrapeConfirmText').textContent = confirmText;
            document.getElementById('scrapeModal').style.display = 'flex';
        }

        function closeScrapeModal() {
            document.getElementById('scrapeModal').style.display = 'none';
            scrapeSystemId = null;
            scrapeSystemName = null;
        }

        function submitScrape() {
            if (!scrapeSystemId) {
                const msg = typeof I18n !== 'undefined' && I18n.t ? I18n.t('please_select_system', '请选择要刮削的系统') : '请选择要刮削的系统';
                showStatus(msg, 'error');
                return;
            }

            const data = {
                systemId: scrapeSystemId
            };

            closeScrapeModal();

            const scrapingMsg = (typeof I18n !== 'undefined' && I18n.t ? I18n.t('scraping_system', '正在刮削系统') : '正在刮削系统') + ' ' + scrapeSystemName + '...';
            showStatus(scrapingMsg, 'success');

            fetch('/api/scraper-systems/scrape-all', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    const successMsg = typeof I18n !== 'undefined' && I18n.t ? I18n.t('scrape_task_started', '刮削任务已启动！请在任务管理页面查看进度') : '刮削任务已启动！请在任务管理页面查看进度';
                    showStatus(successMsg, 'success');
                } else {
                    const failedMsg = (typeof I18n !== 'undefined' && I18n.t ? I18n.t('scrape_failed', '刮削失败') : '刮削失败') + ': ' + (result.message || '未知错误');
                    showStatus(failedMsg, 'error');
                }
            })
            .catch(error => {
                const errorMsg = (typeof I18n !== 'undefined' && I18n.t ? I18n.t('scrape_failed', '刮削失败') : '刮削失败') + ': ' + error.message;
                showStatus(errorMsg, 'error');
            });
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = message;
            statusDiv.className = 'status-message status-' + type;
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 5000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/"/g, '&quot;')
                       .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSystems();
            checkUserCredentials();
        });
    </script>

</body>
