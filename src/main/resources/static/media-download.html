<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="media_download_mgmt_title">媒体下载管理 - 前端杀手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            background-attachment: fixed;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(50, 100, 200, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(200, 50, 100, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin: 60px 0 40px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: scan 4s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .header-content {
            position: relative;
            z-index: 2;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            font-family: 'Arial Black', 'Impact', sans-serif;
            letter-spacing: 2px;
        }
        
        .header p {
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 10px;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #00ffff, #0088ff);
            color: #000;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.5);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            color: #fff;
        }
        
        .btn-danger:hover {
            box-shadow: 0 5px 20px rgba(255, 68, 68, 0.5);
        }
        
        .btn-success {
            background: linear-gradient(45deg, #44ff44, #00cc00);
            color: #000;
        }
        
        .btn-success:hover {
            box-shadow: 0 5px 20px rgba(68, 255, 68, 0.5);
        }
        
        .btn-warning {
            background: linear-gradient(45deg, #ffaa00, #ff8800);
            color: #000;
        }
        
        .btn-warning:hover {
            box-shadow: 0 5px 20px rgba(255, 170, 0, 0.5);
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .status-item {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            text-align: center;
        }
        
        .status-item .label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .status-item .value {
            font-size: 2rem;
            font-weight: bold;
            color: #00ffff;
        }
        
        .status-item.downloading .value {
            color: #ffaa00;
        }
        
        .status-item.completed .value {
            color: #44ff44;
        }
        
        .status-item.failed .value {
            color: #ff4444;
        }
        
        .status-item.stopped .value {
            color: #aaaaaa;
        }
        
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .platform-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            animation: gradient 3s linear infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .platform-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
            border-color: #ff00ff;
        }
        
        .platform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .platform-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ffff;
        }
        
        .platform-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .platform-status.running {
            background: rgba(68, 255, 68, 0.2);
            color: #44ff44;
            border: 1px solid #44ff44;
        }
        
        .platform-status.stopped {
            background: rgba(170, 170, 170, 0.2);
            color: #aaaaaa;
            border: 1px solid #aaaaaa;
        }
        
        .platform-status.waiting {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }
        
        .platform-status.idle {
            background: rgba(0, 136, 255, 0.2);
            color: #0088ff;
            border: 1px solid #0088ff;
        }
        
        .platform-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 8px;
        }
        
        .stat-item .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        
        .stat-item .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .stat-item.pending .stat-value {
            color: #00ffff;
        }
        
        .stat-item.downloading .stat-value {
            color: #ffaa00;
        }
        
        .stat-item.completed .stat-value {
            color: #44ff44;
        }
        
        .stat-item.failed .stat-value {
            color: #ff4444;
        }
        
        .stat-item.stopped .stat-value {
            color: #aaaaaa;
        }
        
        .platform-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .platform-actions .btn {
            flex: 1;
            text-align: center;
            padding: 8px 15px;
            font-size: 12px;
        }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px dashed #00ffff;
            border-radius: 15px;
            margin-top: 50px;
        }
        
        .empty-state h3 {
            font-size: 1.5rem;
            color: #00ffff;
            margin-bottom: 15px;
        }
        
        .empty-state p {
            color: #888;
            font-size: 1rem;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #00ffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ffff, #0088ff);
            border: none;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.7);
        }
        
        .toast {
            position: fixed;
            bottom: 100px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .toast.success {
            background: linear-gradient(45deg, #44ff44, #00cc00);
        }
        
        .toast.error {
            background: linear-gradient(45deg, #ff4444, #cc0000);
        }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 8px;
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        
        .progress-bar {
            height: 6px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            transition: width 0.5s ease;
        }
        
        @media (max-width: 768px) {
            .platform-grid {
                grid-template-columns: 1fr;
            }
            
            .platform-stats {
                grid-template-columns: 1fr;
            }
            
            .status-bar {
                flex-direction: column;
                align-items: center;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link" data-i18n="back_to_home">← 返回主页</a>
    
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1 data-i18n="media_download_mgmt_title">媒体下载管理</h1>
                <p data-i18n="media_download_mgmt_desc">管理各平台的媒体文件刮削状态</p>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-danger" onclick="stopAllDownloads()" data-i18n="stop_all_scrape">⏹️ 停止所有刮削</button>
            <button class="btn" onclick="refreshPlatforms()" data-i18n="refresh_status">🔄 刷新状态</button>
        </div>

        <!-- 游戏信息刮削状态卡片 -->
        <div class="platform-card" style="border-color: #ff00ff; margin-bottom: 30px;">
            <div class="platform-header">
                <div class="platform-name" style="color: #ff00ff;" data-i18n="game_info_scrape" data-i18n="game_info_scrape">🎮 游戏信息刮削</div>
                <span class="platform-status" id="scrapingStatusBadge" data-i18n="status_idle">空闲</span>
            </div>
            
            <div class="platform-stats">
                <div class="stat-item pending">
                    <div class="stat-label" data-i18n="pending_label" data-i18n="pending_label">待处理</div>
                    <div class="stat-value" id="pendingGames">0</div>
                </div>
                <div class="stat-item downloading">
                    <div class="stat-label" data-i18n="processing_label" data-i18n="processing_label">处理中</div>
                    <div class="stat-value" id="processingGames">0</div>
                </div>
                <div class="stat-item completed">
                    <div class="stat-label" data-i18n="completed_label" data-i18n="completed_label">已完成</div>
                    <div class="stat-value" id="scrapedGames">0</div>
                </div>
            </div>

            <div class="platform-stats">
                <div class="stat-item failed">
                    <div class="stat-label" data-i18n="failed_label" data-i18n="failed_label">失败</div>
                    <div class="stat-value" id="failedGames">0</div>
                </div>
                <div class="stat-item stopped">
                    <div class="stat-label" data-i18n="stopped_label" data-i18n="stopped_label">已停止</div>
                    <div class="stat-value" id="stoppedGames">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label" data-i18n="total_count_label" data-i18n="total_count_label">总计</div>
                    <div class="stat-value" style="color: #00ffff;" id="totalGames">0</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="scrapingProgressFill" style="width: 0%"></div>
            </div>
            <div style="text-align: right; font-size: 12px; color: #888; margin-top: 5px;"><span data-i18n="progress_label">进度</span>: <span id="scrapingProgress">0%</span></div>

            <div class="platform-actions">
                <button class="btn btn-warning" id="pauseScrapingBtn" onclick="pauseScraping()" style="display: none;" data-i18n="btn_pause">⏸️ 暂停</button>
                <button class="btn btn-success" id="resumeScrapingBtn" onclick="resumeScraping()" style="display: none;" data-i18n="btn_resume">▶️ 恢复</button>
                <button class="btn btn-danger" id="stopScrapingBtn" onclick="stopScraping()" style="display: none;" data-i18n="btn_stop">⏹️ 停止</button>
                <button class="btn btn-danger" id="deleteScrapingTaskBtn" onclick="deleteScrapingTask()" style="display: none;" data-i18n="btn_delete_task">🗑️ 删除任务</button>
            </div>
        </div>

        <!-- ScreenScraper 配额信息面板 -->
        <div class="quota-panel" style="margin: 20px 0; padding: 15px; background: rgba(0, 255, 255, 0.05); border-radius: 10px; border: 1px solid rgba(0, 255, 255, 0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="color: #00ffff; margin: 0; font-size: 14px;" data-i18n="quota_info_title" data-i18n="quota_info_title">📊 ScreenScraper 配额信息</h3>
                <span id="quotaUpdateTime" data-i18n="quota_waiting" style="color: #888; font-size: 11px;" data-i18n="quota_waiting">等待数据...</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                <div style="text-align: center;">
                    <div style="color: #888; font-size: 11px;" data-i18n="quota_today_requests" data-i18n="quota_today_requests">今日请求</div>
                    <div style="color: #ffd700; font-size: 18px; font-weight: bold;" id="quotaRequestsToday">-</div>
                </div>
                <div style="text-align: center;">
                    <div style="color: #888; font-size: 11px;" data-i18n="quota_daily_limit" data-i18n="quota_daily_limit">每日上限</div>
                    <div style="color: #00ffff; font-size: 18px;" id="quotaMaxPerDay">-</div>
                </div>
                <div style="text-align: center;">
                    <div style="color: #888; font-size: 11px;" data-i18n="quota_usage_rate" data-i18n="quota_usage_rate">使用率</div>
                    <div style="font-size: 18px; font-weight: bold;" id="quotaUsagePercent">-</div>
                </div>
                <div style="text-align: center;">
                    <div style="color: #888; font-size: 11px;" data-i18n="quota_threads" data-i18n="quota_threads">并发线程</div>
                    <div style="color: #00ffff; font-size: 18px;" id="quotaMaxThreads">-</div>
                </div>
                <div style="text-align: center;">
                    <div style="color: #888; font-size: 11px;" data-i18n="quota_user_level" data-i18n="quota_user_level">用户等级</div>
                    <div style="color: #ccc; font-size: 14px;" id="quotaUserNiveau">-</div>
                </div>
                <div style="text-align: center;">
                    <div style="color: #888; font-size: 11px;" data-i18n="quota_contrib_level" data-i18n="quota_contrib_level">贡献等级</div>
                    <div style="color: #ccc; font-size: 14px;" id="quotaUserContribution">-</div>
                </div>
            </div>
            <!-- 配额进度条 -->
            <div style="margin-top: 10px;">
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 3px;">
                    <span data-i18n="quota_usage_progress">配额使用进度</span>
                    <span id="quotaProgressText">0 / 0</span>
                </div>
                <div style="background: rgba(0, 0, 0, 0.3); border-radius: 4px; height: 8px; overflow: hidden;">
                    <div id="quotaProgressBar" style="background: linear-gradient(90deg, #00ffff, #ffd700); height: 100%; width: 0%; transition: width 0.3s ease;"></div>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="label" data-i18n="total_platforms">平台总数</div>
                <div class="value" id="totalPlatforms">0</div>
            </div>
            <div class="status-item downloading">
                <div class="label" data-i18n="scraping_now">正在刮削</div>
                <div class="value" id="totalDownloading">0</div>
            </div>
            <div class="status-item completed">
                <div class="label" data-i18n="completed_label">已完成</div>
                <div class="value" id="totalCompleted">0</div>
            </div>
            <div class="status-item failed">
                <div class="label" data-i18n="failed_label">失败</div>
                <div class="value" id="totalFailed">0</div>
            </div>
            <div class="status-item stopped">
                <div class="label" data-i18n="stopped_label">已停止</div>
                <div class="value" id="totalStopped">0</div>
            </div>
        </div>

        <div id="platformGrid" class="platform-grid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p data-i18n="loading_text">加载中...</p>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="refreshPlatforms()">🔄</button>

    <script src="js/i18n.js"></script>
    <script>
        let platforms = [];

        // 获取游戏信息刮削状态
        async function fetchScrapingStatus() {
            try {
                const response = await fetch('/api/scraper/status');
                const data = await response.json();
                if (data.success && data.data) {
                    return data.data;
                }
                return { isRunning: false, scrapedCount: 0, totalCount: 0 };
            } catch (error) {
                console.error('获取刮削状态失败:', error);
                return { isRunning: false, scrapedCount: 0, totalCount: 0 };
            }
        }

        // 更新游戏信息刮削状态显示
        async function updateScrapingStatus() {
            const status = await fetchScrapingStatus();
            
            // 计算进度
            const progress = status.totalCount > 0 
                ? Math.round((status.scrapedCount / status.totalCount) * 100) 
                : 0;

            // 更新状态徽章
            const statusBadge = document.getElementById('scrapingStatusBadge');
            const isPaused = status.isPaused === true;
            const isRunning = status.isRunning === true && !isPaused;
            
            let statusText, statusClass;
            if (isRunning) {
                statusText = '运行中';
                statusClass = 'running';
            } else if (isPaused) {
                statusText = I18n.t('status_paused', '已暂停');
                statusClass = 'stopped';
            } else {
                statusText = I18n.t('status_idle', '空闲');
                statusClass = 'idle';
            }
            
            statusBadge.textContent = statusText;
            statusBadge.className = `platform-status ${statusClass}`;

            // 更新统计数据
            document.getElementById('pendingGames').textContent = status.pendingCount || 0;
            document.getElementById('processingGames').textContent = status.processingCount || 0;
            document.getElementById('scrapedGames').textContent = status.scrapedCount || 0;
            document.getElementById('failedGames').textContent = status.failedCount || 0;
            document.getElementById('stoppedGames').textContent = status.stoppedCount || 0;
            document.getElementById('totalGames').textContent = status.totalCount || 0;
            document.getElementById('scrapingProgress').textContent = `${progress}%`;
            document.getElementById('scrapingProgressFill').style.width = `${progress}%`;

            // 更新按钮显示状态
            updateScrapingButtons(isRunning, isPaused);
            
            // 更新配额信息
            updateQuotaInfo();
        }

        // 更新配额信息显示
        async function updateQuotaInfo() {
            try {
                const response = await fetch('/api/scraper/thread-status');
                const data = await response.json();
                if (data.success && data.data && data.data.quota) {
                    const quota = data.data.quota;
                    const maxThreads = data.data.maxThreads;
                    
                    // 更新配额数据
                    document.getElementById('quotaRequestsToday').textContent = quota.requestsToday.toLocaleString();
                    document.getElementById('quotaMaxPerDay').textContent = quota.maxRequestsPerDay.toLocaleString();
                    document.getElementById('quotaMaxThreads').textContent = maxThreads;
                    document.getElementById('quotaUserNiveau').textContent = quota.userNiveau || '-';
                    document.getElementById('quotaUserContribution').textContent = quota.userContribution || '-';
                    
                    // 更新使用率
                    const usagePercent = quota.usagePercent || 0;
                    const usageElement = document.getElementById('quotaUsagePercent');
                    usageElement.textContent = usagePercent + '%';
                    
                    // 根据使用率设置颜色
                    if (usagePercent >= 90) {
                        usageElement.style.color = '#ff4444'; // 红色 - 危险
                    } else if (usagePercent >= 70) {
                        usageElement.style.color = '#ffa500'; // 橙色 - 警告
                    } else {
                        usageElement.style.color = '#00ff00'; // 绿色 - 正常
                    }
                    
                    // 更新进度条
                    document.getElementById('quotaProgressBar').style.width = usagePercent + '%';
                    document.getElementById('quotaProgressText').textContent = 
                        `${quota.requestsToday.toLocaleString()} / ${quota.maxRequestsPerDay.toLocaleString()}`;
                    
                    // 更新进度条颜色（高使用率时变红）
                    const progressBar = document.getElementById('quotaProgressBar');
                    if (usagePercent >= 90) {
                        progressBar.style.background = 'linear-gradient(90deg, #ffa500, #ff4444)';
                    } else if (usagePercent >= 70) {
                        progressBar.style.background = 'linear-gradient(90deg, #00ffff, #ffa500)';
                    } else {
                        progressBar.style.background = 'linear-gradient(90deg, #00ffff, #ffd700)';
                    }
                    
                    // 更新时间
                    const now = new Date();
                    document.getElementById('quotaUpdateTime').textContent = 
                        `更新于 ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                }
            } catch (error) {
                console.error('获取配额信息失败:', error);
            }
        }

        // 更新刮削按钮状态
        function updateScrapingButtons(isRunning, isPaused) {
            const pauseBtn = document.getElementById('pauseScrapingBtn');
            const resumeBtn = document.getElementById('resumeScrapingBtn');
            const stopBtn = document.getElementById('stopScrapingBtn');
            const deleteBtn = document.getElementById('deleteScrapingTaskBtn');

            if (isRunning) {
                // 运行中：显示暂停和停止按钮
                pauseBtn.style.display = 'block';
                resumeBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                deleteBtn.style.display = 'none';
            } else if (isPaused) {
                // 已暂停：显示恢复和停止按钮
                pauseBtn.style.display = 'none';
                resumeBtn.style.display = 'block';
                stopBtn.style.display = 'block';
                deleteBtn.style.display = 'none';
            } else {
                // 空闲：隐藏所有按钮
                pauseBtn.style.display = 'none';
                resumeBtn.style.display = 'none';
                stopBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
            }
        }

        // 暂停游戏信息刮削
        async function pauseScraping() {
            try {
                const response = await fetch('/api/scraper/pause', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削已暂停', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('pause_failed', '暂停失败'), 'error');
                }
            } catch (error) {
                console.error('暂停游戏信息刮削失败:', error);
                showToast(I18n.t('pause_failed', '暂停失败'), 'error');
            }
        }

        // 恢复游戏信息刮削
        async function resumeScraping() {
            try {
                const response = await fetch('/api/scraper/resume', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削已恢复', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('resume_failed', '恢复失败'), 'error');
                }
            } catch (error) {
                console.error('恢复游戏信息刮削失败:', error);
                showToast(I18n.t('resume_failed', '恢复失败'), 'error');
            }
        }

        // 停止游戏信息刮削
        async function stopScraping() {
            if (!confirm('确定要停止游戏信息刮削吗？')) {
                return;
            }
            
            try {
                const response = await fetch('/api/scraper/stop', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削已停止', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (error) {
                console.error('停止游戏信息刮削失败:', error);
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        }

        // 删除游戏信息刮削任务
        async function deleteScrapingTask() {
            if (!confirm('确定要删除游戏信息刮削任务吗？')) {
                return;
            }
            
            try {
                const response = await fetch('/api/scraper/delete', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('游戏信息刮削任务已删除', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('delete_failed', '删除失败'), 'error');
                }
            } catch (error) {
                console.error('删除游戏信息刮削任务失败:', error);
                showToast(I18n.t('delete_failed', '删除失败'), 'error');
            }
        }

        async function fetchPlatforms() {
            try {
                const response = await fetch('/api/media-download/platforms');
                const data = await response.json();
                if (data.success && data.data) {
                    return data.data;
                }
                return [];
            } catch (error) {
                console.error('获取平台列表失败:', error);
                return [];
            }
        }

        async function fetchPlatformStats(platformId) {
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/stats`);
                const data = await response.json();
                if (data.success && data.data) {
                    return data.data;
                }
                return null;
            } catch (error) {
                console.error(`获取平台 ${platformId} 统计失败:`, error);
                return null;
            }
        }

        async function fetchPlatformInfo(platformId) {
            try {
                const response = await fetch(`/api/platforms/${platformId}`);
                const data = await response.json();
                if (data.success && data.data) {
                    return data.data;
                }
                return null;
            } catch (error) {
                console.error(`获取平台信息失败:`, error);
                return null;
            }
        }

        function getPlatformStatus(stats) {
            if (stats.stopped > 0 && stats.pending === 0 && stats.downloading === 0) {
                return 'stopped';
            } else if (stats.downloading > 0) {
                return 'running';
            } else if (stats.pending > 0) {
                // 有 PENDING 任务但无下载进行中（重启后恢复/额度耗尽后等待恢复）
                return 'waiting';
            } else {
                return 'idle';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'running': return '运行中';
                case 'stopped': return '已停止';
                case 'waiting': return '等待中';
                case 'idle': return '空闲';
                default: return '未知';
            }
        }

        function getProgress(stats) {
            const total = stats.total || 1;
            const completed = stats.completed || 0;
            return Math.round((completed / total) * 100);
        }

        async function buildPlatformCard(platformId) {
            const stats = await fetchPlatformStats(platformId);
            if (!stats) return null;

            const platformInfo = await fetchPlatformInfo(platformId);
            const platformName = platformInfo ? platformInfo.name : `平台 ${platformId}`;
            
            const status = getPlatformStatus(stats);
            const progress = getProgress(stats);

            return `
                <div class="platform-card">
                    <div class="platform-header">
                        <div class="platform-name">${platformName}</div>
                        <span class="platform-status ${status}">${getStatusText(status)}</span>
                    </div>
                    
                    <div class="platform-stats">
                        <div class="stat-item pending">
                            <div class="stat-label" data-i18n="pending_download">待下载</div>
                            <div class="stat-value">${stats.pending || 0}</div>
                        </div>
                        <div class="stat-item downloading">
                            <div class="stat-label" data-i18n="downloading_label">下载中</div>
                            <div class="stat-value">${stats.downloading || 0}</div>
                        </div>
                        <div class="stat-item completed">
                            <div class="stat-label" data-i18n="completed_label" data-i18n="completed_label">已完成</div>
                            <div class="stat-value">${stats.completed || 0}</div>
                        </div>
                    </div>

                    <div class="platform-stats">
                        <div class="stat-item failed">
                            <div class="stat-label" data-i18n="failed_label" data-i18n="failed_label">失败</div>
                            <div class="stat-value">${stats.failed || 0}</div>
                        </div>
                        <div class="stat-item stopped">
                            <div class="stat-label" data-i18n="stopped_label" data-i18n="stopped_label">已停止</div>
                            <div class="stat-value">${stats.stopped || 0}</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label" data-i18n="total_count_label" data-i18n="total_count_label">总计</div>
                            <div class="stat-value" style="color: #00ffff;">${stats.total || 0}</div>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div style="text-align: right; font-size: 12px; color: #888; margin-top: 5px;">进度: ${progress}%</div>

                    <div class="platform-actions">
                        ${status === 'stopped' || status === 'waiting' ? `
                            <button class="btn btn-success" onclick="resumePlatform(${platformId})">▶️ 恢复</button>
                        ` : `
                            <button class="btn btn-danger" onclick="stopPlatform(${platformId})">⏹️ 停止</button>
                        `}
                        <button class="btn btn-danger" onclick="deletePlatformScrapeTask(${platformId})">🗑️ 删除任务</button>
                    </div>
                </div>
            `;
        }

        async function refreshPlatforms() {
            // 同时更新游戏信息刮削状态
            await updateScrapingStatus();
            
            const platformIds = await fetchPlatforms();
            const platformGrid = document.getElementById('platformGrid');
            
            if (platformIds.length === 0) {
                platformGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 暂无媒体下载任务</h3>
                        <p>当前没有需要刮削的媒体文件，请先执行刮削任务</p>
                    </div>
                `;
                updateTotalStats({ total: 0, downloading: 0, completed: 0, failed: 0, stopped: 0 });
                return;
            }

            platformGrid.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p data-i18n="loading_text">加载中...</p></div>';

            const cards = await Promise.all(platformIds.map(id => buildPlatformCard(id)));
            const validCards = cards.filter(c => c !== null);

            if (validCards.length === 0) {
                platformGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>📭 暂无媒体下载任务</h3>
                        <p>当前没有需要刮削的媒体文件</p>
                    </div>
                `;
            } else {
                platformGrid.innerHTML = validCards.join('');
            }

            await updateTotalStatsFromPlatforms(platformIds);
        }

        async function updateTotalStatsFromPlatforms(platformIds) {
            let total = 0, downloading = 0, completed = 0, failed = 0, stopped = 0;

            for (const id of platformIds) {
                const stats = await fetchPlatformStats(id);
                if (stats) {
                    total++;
                    downloading += stats.downloading || 0;
                    completed += stats.completed || 0;
                    failed += stats.failed || 0;
                    stopped += stats.stopped || 0;
                }
            }

            updateTotalStats({ total, downloading, completed, failed, stopped });
        }

        function updateTotalStats(stats) {
            document.getElementById('totalPlatforms').textContent = stats.total;
            document.getElementById('totalDownloading').textContent = stats.downloading;
            document.getElementById('totalCompleted').textContent = stats.completed;
            document.getElementById('totalFailed').textContent = stats.failed;
            document.getElementById('totalStopped').textContent = stats.stopped;
        }

        async function stopPlatform(platformId) {
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/stop`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('平台刮削已停止', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (error) {
                console.error('停止平台刮削失败:', error);
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        }

        async function resumePlatform(platformId) {
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/resume`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('平台刮削已恢复', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('resume_failed', '恢复失败'), 'error');
                }
            } catch (error) {
                console.error('恢复平台刮削失败:', error);
                showToast(I18n.t('resume_failed', '恢复失败'), 'error');
            }
        }
        
        async function deletePlatformScrapeTask(platformId) {
            if (!confirm('确定要删除该平台的所有刮削任务吗？这将清除该平台的所有刮削队列。')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/media-download/platforms/${platformId}/delete`, {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('平台刮削任务已删除', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('delete_failed', '删除失败'), 'error');
                }
            } catch (error) {
                console.error('删除平台刮削任务失败:', error);
                showToast(I18n.t('delete_failed', '删除失败'), 'error');
            }
        }

        async function stopAllDownloads() {
            if (!confirm('确定要停止所有平台的刮削吗？')) {
                return;
            }
            
            try {
                const response = await fetch('/api/media-download/platforms/stop-all', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    showToast('所有平台刮削已停止', 'success');
                    await refreshPlatforms();
                } else {
                    showToast(data.message || I18n.t('stop_failed', '停止失败'), 'error');
                }
            } catch (error) {
                console.error('停止所有平台刮削失败:', error);
                showToast(I18n.t('stop_failed', '停止失败'), 'error');
            }
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', refreshPlatforms);

        setInterval(refreshPlatforms, 10000);
    </script>
</body>
</html>
