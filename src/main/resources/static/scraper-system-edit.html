<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="scraper_system_edit_title">编辑刮削系统 - 前端杀手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(50, 100, 200, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(200, 50, 100, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin: 60px 0 40px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            font-family: 'Arial Black', 'Impact', sans-serif;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00ffff, #0088ff);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #666666, #444444);
            color: #fff;
            box-shadow: 0 0 15px rgba(102, 102, 102, 0.5);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(102, 102, 102, 0.8);
        }

        .btn-success {
            background: linear-gradient(45deg, #00ff88, #00aa55);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }

        .form-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #00ffff;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row .form-group {
            margin-bottom: 20px;
        }

        .status-message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .status-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
            display: block;
        }

        .status-error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            display: block;
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00ffff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ff00ff;
        }

        .required {
            color: #ff4444;
            margin-left: 5px;
        }

        .language-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 255, 0.2);
        }

        .language-section h3 {
            color: #00ffff;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="scraper-system-list.html" class="back-link" data-i18n="back_to_scraper_list">← 返回系统列表</a>
        
        <div class="header">
            <div class="header-content">
                <h1 id="page-title" data-i18n="scraper_system_add_title">添加刮削系统</h1>
                <p id="page-desc" data-i18n="scraper_system_add_desc">添加或编辑 ScreenScraper 游戏系统数据</p>
            </div>
        </div>

        <div id="status-message" class="status-message"></div>

        <div class="form-container">
            <form id="system-form">
                <input type="hidden" id="id" name="id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="systemId" data-i18n="label_system_id">系统ID <span class="required">*</span></label>
                        <input type="number" id="systemId" name="systemId" required placeholder="ScreenScraper系统ID" data-i18n-placeholder="system_id_placeholder">
                    </div>
                    
                    <div class="form-group">
                        <label for="type" data-i18n="label_type">类型</label>
                        <input type="text" id="type" name="type" placeholder="如: console, arcade, handheld" data-i18n-placeholder="type_placeholder">
                    </div>
                </div>

                <div class="form-group">
                    <label for="name" data-i18n="label_name">名称（法语）<span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="系统名称（法语）" data-i18n-placeholder="name_placeholder">
                </div>

                <div class="language-section">
                    <h3 data-i18n="label_translations">多语言名称</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nameEn" data-i18n="label_name_en">英文名称</label>
                            <input type="text" id="nameEn" name="nameEn" placeholder="English name">
                        </div>
                        
                        <div class="form-group">
                            <label for="nameFr" data-i18n="label_name_fr">法语名称</label>
                            <input type="text" id="nameFr" name="nameFr" placeholder="Nom français">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nameJp" data-i18n="label_name_jp">日语名称</label>
                            <input type="text" id="nameJp" name="nameJp" placeholder="日本語名" data-i18n-placeholder="name_jp_placeholder">
                        </div>
                        
                        <div class="form-group">
                            <label for="nameCn" data-i18n="label_name_cn">中文名称</label>
                            <input type="text" id="nameCn" name="nameCn" placeholder="中文名称" data-i18n-placeholder="name_cn_placeholder">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="company" data-i18n="label_company">制造商</label>
                        <input type="text" id="company" name="company" placeholder="如: Nintendo, Sony, Sega" data-i18n-placeholder="company_placeholder">
                    </div>
                    
                    <div class="form-group">
                        <label for="releaseYear" data-i18n="label_release_year">发行年份</label>
                        <input type="number" id="releaseYear" name="releaseYear" placeholder="如: 1990" data-i18n-placeholder="release_year_placeholder">
                    </div>
                </div>

                <div class="form-group">
                    <label for="iconUrl" data-i18n="label_icon_url">图标URL</label>
                    <input type="text" id="iconUrl" name="iconUrl" placeholder="系统图标链接" data-i18n-placeholder="icon_url_placeholder">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="goBack()" data-i18n="btn_cancel">取消</button>
                    <button type="submit" class="btn btn-success" data-i18n="btn_save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isEdit = false;

        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function loadSystem(id) {
            fetch(`/api/scraper-systems/${id}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.data) {
                        const system = data.data;
                        document.getElementById('id').value = system.id;
                        document.getElementById('systemId').value = system.systemId;
                        document.getElementById('name').value = system.name;
                        document.getElementById('nameEn').value = system.nameEn || '';
                        document.getElementById('nameFr').value = system.nameFr || '';
                        document.getElementById('nameJp').value = system.nameJp || '';
                        document.getElementById('nameCn').value = system.nameCn || '';
                        document.getElementById('company').value = system.company || '';
                        document.getElementById('type').value = system.type || '';
                        document.getElementById('releaseYear').value = system.releaseYear || '';
                        document.getElementById('iconUrl').value = system.iconUrl || '';

                        document.getElementById('page-title').textContent = I18n.t('edit_scraper_system_title', '编辑刮削系统');
                        document.getElementById('page-desc').textContent = I18n.t('edit_scraper_system_desc', '修改刮削系统信息');
                        isEdit = true;
                    } else {
                        showStatus(data.message || I18n.t('load_system_failed', '加载系统数据失败'), 'error');
                    }
                })
                .catch(error => {
                    showStatus(I18n.t('load_system_failed', '加载系统数据失败') + ': ' + error.message, 'error');
                });
        }

        function saveSystem() {
            const system = {
                id: document.getElementById('id').value ? parseInt(document.getElementById('id').value) : null,
                systemId: parseInt(document.getElementById('systemId').value),
                name: document.getElementById('name').value,
                nameEn: document.getElementById('nameEn').value || null,
                nameFr: document.getElementById('nameFr').value || null,
                nameJp: document.getElementById('nameJp').value || null,
                nameCn: document.getElementById('nameCn').value || null,
                company: document.getElementById('company').value || null,
                type: document.getElementById('type').value || null,
                releaseYear: document.getElementById('releaseYear').value ? parseInt(document.getElementById('releaseYear').value) : null,
                iconUrl: document.getElementById('iconUrl').value || null
            };

            const url = isEdit ? `/api/scraper-systems/${system.id}` : '/api/scraper-systems';
            const method = isEdit ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(system)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(isEdit ? I18n.t('update_success', '更新成功') : I18n.t('create_success', '创建成功'), 'success');
                    setTimeout(() => {
                        window.location.href = 'scraper-system-list.html';
                    }, 1500);
                } else {
                    showStatus(data.message, 'error');
                }
            })
            .catch(error => {
                showStatus(I18n.t('save_failed_prefix', '保存失败: ') + error.message, 'error');
            });
        }

        function goBack() {
            window.location.href = 'scraper-system-list.html';
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = 'status-message status-' + type;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const id = getUrlParam('id');
            if (id) {
                loadSystem(id);
            }

            document.getElementById('system-form').addEventListener('submit', (e) => {
                e.preventDefault();
                saveSystem();
            });
        });
    </script>
</body>
</html>
